---
# Public keys only; there is nothing to encrypt here. These are the signatures
# source-controller accepts on the HEAD commit of main (the FluxInstance in
# helmrelease.yaml patches GitRepository/flux-system with spec.verify.mode: HEAD
# and this Secret). A revision whose HEAD is not signed by one of these keys is
# rejected before it becomes an artifact: the last verified revision stays
# applied and the GitRepository turns Not Ready (SourceVerified=False) until a
# signed commit lands or this list is updated. `flux get sources git -n
# flux-system` shows it; see observability/kube-prometheus-stack for the alert.
#
# What this stops: a plain `git push` to main made with a stolen GitHub
# credential but without one of these signing keys. Accepted residual: commits
# GitHub itself creates for a credential through its UI or API (a pull request
# merge, the contents or GraphQL commit endpoints) carry the web-flow signature
# below, so a stolen credential that goes through a pull request still lands.
# The ruleset on main only adds the pull request and green checks to that
# path; the owner's own credential bypasses it, and a compromised Renovate
# token could open and merge its own PR.
#
#   owner.asc            GPG key F361E9BEF41F8AA4 (signing subkey 1AC30C411413E9DD),
#                        the copy GitHub serves, valid to 2030-05-27, reduced to
#                        one UID. Direct pushes; GitButler and git must keep
#                        commit signing on.
#   github-web-flow.asc  GitHub's key B5690EEEBB952194 (no expiry), which signs
#                        the squash and merge commits GitHub creates for pull
#                        requests, Renovate's included.
#
# Update: curl https://github.com/mihirsamdarshi.gpg (then export only the key
# with the wanted UID) and https://github.com/web-flow.gpg (export only the
# current key). Check the list whenever GitHub rotates its key or the owner's
# key is renewed or replaced.
apiVersion: v1
kind: Secret
metadata:
  name: flux-git-signing-keys
  annotations:
    # Deleting this file must not take the Secret away under the
    # GitRepository that requires it.
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
