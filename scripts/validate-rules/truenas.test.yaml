# Unit tests for prometheusrule-truenas.yaml, run by scripts/validate-kubernetes.sh with promtool.
# Generated series use the names and labels the exporters publish (smartctl_exporter v0.15.0,
# node_exporter v1.12.1, the zpool-textfile sidecar). The time constants (3 h, 1 d, 7 d, 30 m, 10 m ...)
# are the real ones. The 35-day scrub-age rule is tested in truenas.long.test.yaml with a one-hour step.
rule_files:
  - truenas.rules.yaml
evaluation_interval: 30s
tests:
  - name: 'pending sectors rise from 0 to 8: increase and level alerts fire'
    interval: 30s
    input_series:
      - series: 'smartctl_device_attribute{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",attribute_id="197",attribute_value_type="raw"}'
        values: '0+0x240 8+0x3600'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x4800'
    alert_rule_test:
      - eval_time: 1h
        alertname: TrueNASDiskPendingSectorsIncreasing
        exp_alerts: []
      - eval_time: 2h10m
        alertname: TrueNASDiskPendingSectorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              attribute_id: '197'
              attribute_value_type: 'raw'
            exp_annotations:
              description: 'Sectors the disk could not read are waiting for a rewrite. Check the pool and the disk plan; this disk may be failing.'
              summary: '2262JR66T (M-2262JR66T): pending sectors rose by 8 in 24 h'
      - eval_time: 3h
        alertname: TrueNASDiskPendingSectors
        exp_alerts: []
      - eval_time: 3h10m
        alertname: TrueNASDiskPendingSectors
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              attribute_id: '197'
              attribute_value_type: 'raw'
            exp_annotations:
              description: 'Attribute 197 (current pending sector count) is not zero.'
              summary: '2262JR66T (M-2262JR66T): 8 sectors are pending reallocation'
  - name: 'offline-uncorrectable constant at 5: level fires, increase does not'
    interval: 30s
    input_series:
      - series: 'smartctl_device_attribute{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",attribute_id="198",attribute_value_type="raw"}'
        values: '5+0x720'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x720'
    alert_rule_test:
      - eval_time: 3h
        alertname: TrueNASDiskUncorrectableSectorsIncreasing
        exp_alerts: []
      - eval_time: 1h10m
        alertname: TrueNASDiskUncorrectableSectors
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              attribute_id: '198'
              attribute_value_type: 'raw'
            exp_annotations:
              description: 'Attribute 198 is not zero. A silence for the known case (2262JR66T) is created in Alertmanager, with an expiry; the increase and pending alerts stay on.'
              summary: '2262JR66T (M-2262JR66T): 5 offline-uncorrectable sectors'
  - name: 'pending falls 8 to 0 while reallocated rises 0 to 8'
    interval: 30s
    input_series:
      - series: 'smartctl_device_attribute{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",attribute_id="197",attribute_value_type="raw"}'
        values: '8+0x240 0+0x720'
      - series: 'smartctl_device_attribute{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",attribute_id="5",attribute_value_type="raw"}'
        values: '0+0x240 8+0x720'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x960'
    alert_rule_test:
      - eval_time: 2h10m
        alertname: TrueNASDiskReallocatedSectorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              attribute_id: '5'
              attribute_value_type: 'raw'
            exp_annotations:
              description: 'The disk is remapping bad sectors. A rise right after a pending-sector alert is expected.'
              summary: '2262JR66T (M-2262JR66T): reallocated sectors rose by 8 in 24 h'
  - name: 'two disks: only the disk whose pending count rose alerts, and it carries its own serial'
    interval: 30s
    input_series:
      - series: 'smartctl_device_attribute{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",attribute_id="197",attribute_value_type="raw"}'
        values: '0+0x120 3+0x360'
      - series: 'smartctl_device_attribute{device="ata-DISK_WJG2F1MX",instance="nas:9633",job="truenas-smart",attribute_id="197",attribute_value_type="raw"}'
        values: '0+0x480'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x480'
      - series: 'smartctl_device{device="ata-DISK_WJG2F1MX",instance="nas:9633",job="truenas-smart",model_name="M-WJG2F1MX",protocol="ATA",serial_number="WJG2F1MX"}'
        values: '1+0x480'
    alert_rule_test:
      - eval_time: 1h30m
        alertname: TrueNASDiskPendingSectorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              attribute_id: '197'
              attribute_value_type: 'raw'
            exp_annotations:
              description: 'Sectors the disk could not read are waiting for a rewrite. Check the pool and the disk plan; this disk may be failing.'
              summary: '2262JR66T (M-2262JR66T): pending sectors rose by 3 in 24 h'
  - name: 'SMART error log gains an entry'
    interval: 30s
    input_series:
      - series: 'smartctl_device_error_log_count{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart"}'
        values: '2+0x120 3+0x480'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x600'
    alert_rule_test:
      - eval_time: 1h10m
        alertname: TrueNASDiskErrorLogIncreasing
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
            exp_annotations:
              description: 'The disk logged new errors.'
              summary: '2262JR66T (M-2262JR66T): the SMART error log gained 1 entries in 24 h'
  - name: 'SMART health check fails'
    interval: 30s
    input_series:
      - series: 'smartctl_device_smart_status{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x120 0+0x120'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x240'
    alert_rule_test:
      - eval_time: 1h4m
        alertname: TrueNASDiskSmartFailed
        exp_alerts: []
      - eval_time: 1h10m
        alertname: TrueNASDiskSmartFailed
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
            exp_annotations:
              description: 'The disk reports that it is failing. Replace it.'
              summary: '2262JR66T (M-2262JR66T): the SMART health check reports FAILED'
  - name: 'power-on seconds tick hourly for 4 h, then freeze: stale fires once the window is full'
    interval: 30s
    input_series:
      - series: 'smartctl_device_power_on_seconds{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart"}'
        values: '3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3600000 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3603600 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3607200 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3610800 3614400 3614400+0x480'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x960'
    alert_rule_test:
      - eval_time: 3h50m
        alertname: TrueNASDiskDataStale
        exp_alerts: []
      - eval_time: 7h30m
        alertname: TrueNASDiskDataStale
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
            exp_annotations:
              description: 'smartctl_exporter keeps serving its last good read when a disk stops answering, so the disk may look healthy. Power-on seconds rise every hour on a working disk. The second part of the expression waits for a full 3-hour window of samples (the recording rule runs every 30 s).'
              summary: '2262JR66T (M-2262JR66T): SMART data has not changed for 3 hours'
  - name: 'a fresh series with 25 minutes of data and no hourly tick yet does not alert (install-time guard)'
    interval: 30s
    input_series:
      - series: 'smartctl_device_power_on_seconds{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart"}'
        values: '3600000+0x50'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: TrueNASDiskDataStale
        exp_alerts: []
  - name: 'only the current temperature counts: lifetime maximum 59 is ignored; HDD 51 for 30 min warns; NVMe 71 warns'
    interval: 30s
    input_series:
      - series: 'smartctl_device_temperature{device="ata-DISK_2EHN3EWX",instance="nas:9633",job="truenas-smart",temperature_type="lifetime_max"}'
        values: '59+0x240'
      - series: 'smartctl_device_temperature{device="ata-DISK_2EHN3EWX",instance="nas:9633",job="truenas-smart",temperature_type="current"}'
        values: '44+0x240'
      - series: 'smartctl_device_temperature{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",temperature_type="current"}'
        values: '51+0x240'
      - series: 'smartctl_device_temperature{device="nvme0",instance="nas:9633",job="truenas-smart",temperature_type="current"}'
        values: '71+0x240'
      - series: 'smartctl_device{device="ata-DISK_2EHN3EWX",instance="nas:9633",job="truenas-smart",model_name="M-2EHN3EWX",protocol="ATA",serial_number="2EHN3EWX"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="nvme0",instance="nas:9633",job="truenas-smart",model_name="M-A221116NV012801084",protocol="NVMe",serial_number="A221116NV012801084"}'
        values: '1+0x240'
    alert_rule_test:
      - eval_time: 1h
        alertname: TrueNASDiskTemperatureCritical
        exp_alerts: []
      - eval_time: 40m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              temperature_type: 'current'
            exp_annotations:
              description: 'Hard disks should stay below 50 °C. Check the closet airflow.'
              summary: '2262JR66T (M-2262JR66T): 51 °C for 30 minutes'
      - eval_time: 20m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: TrueNASNvmeTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              device: 'nvme0'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-A221116NV012801084'
              protocol: 'NVMe'
              serial_number: 'A221116NV012801084'
              temperature_type: 'current'
            exp_annotations:
              description: 'The log device is hot.'
              summary: 'A221116NV012801084 (M-A221116NV012801084): NVMe at 71 °C'
  - name: 'HDD at 56 for 10 min is critical'
    interval: 30s
    input_series:
      - series: 'smartctl_device_temperature{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",temperature_type="current"}'
        values: '56+0x120'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
