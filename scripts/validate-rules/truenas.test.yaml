      - eval_time: 20m
        alertname: TrueNASDatasetFilling
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              instance: 'nas:9100'
              job: 'truenas-node'
              mountpoint: '/mnt/nasty/Data'
            exp_annotations:
              description: 'Writes to this dataset will fail soon.'
              summary: 'TrueNAS /mnt/nasty/Data has 4% free'
      - eval_time: 40m
        alertname: TrueNASDatasetFilling
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              instance: 'nas:9100'
              job: 'truenas-node'
              mountpoint: '/mnt/nasty/Data'
            exp_annotations:
              description: 'Writes to this dataset will fail soon.'
              summary: 'TrueNAS /mnt/nasty/Data has 4% free'
          - exp_labels:
              severity: 'warning'
              instance: 'nas:9100'
              job: 'truenas-node'
              mountpoint: '/mnt/nasty/Data'
            exp_annotations:
              description: 'For a dataset with a quota, the size is used plus available under the quota, so a capped dataset warns before the pool is full.'
              summary: 'TrueNAS /mnt/nasty/Data has 4% free'
          - exp_labels:
              severity: 'warning'
              instance: 'nas:9100'
              job: 'truenas-node'
              mountpoint: '/mnt/nasty/Kubernetes'
            exp_annotations:
              description: 'For a dataset with a quota, the size is used plus available under the quota, so a capped dataset warns before the pool is full.'
              summary: 'TrueNAS /mnt/nasty/Kubernetes has 8% free'
