              device: 'ata-DISK_2262JR66T'
              instance: 'nas:9633'
              job: 'truenas-smart'
              model_name: 'M-2262JR66T'
              protocol: 'ATA'
              serial_number: '2262JR66T'
              temperature_type: 'current'
            exp_annotations:
              description: 'Hard disks should stay below 50 °C. Check the closet airflow.'
              summary: '2262JR66T (M-2262JR66T): 51 °C for 30 minutes'
      - eval_time: 2h
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts: []
  - name: 'one of nine disks vanishes: only that serial alerts'
    interval: 30s
    input_series:
      - series: 'smartctl_device_smart_status{device="ata-DISK_WJG2F1MX",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_WJG2F1MX",instance="nas:9633",job="truenas-smart",model_name="M-WJG2F1MX",protocol="ATA",serial_number="WJG2F1MX"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_WJG1MDQD",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_WJG1MDQD",instance="nas:9633",job="truenas-smart",model_name="M-WJG1MDQD",protocol="ATA",serial_number="WJG1MDQD"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_2262JR66T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR66T",protocol="ATA",serial_number="2262JR66T"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_2262JR82T",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_2262JR82T",instance="nas:9633",job="truenas-smart",model_name="M-2262JR82T",protocol="ATA",serial_number="2262JR82T"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_3252JVLQT",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_3252JVLQT",instance="nas:9633",job="truenas-smart",model_name="M-3252JVLQT",protocol="ATA",serial_number="3252JVLQT"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_2EHN3EWX",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_2EHN3EWX",instance="nas:9633",job="truenas-smart",model_name="M-2EHN3EWX",protocol="ATA",serial_number="2EHN3EWX"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="ata-DISK_2EKNWAEX",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="ata-DISK_2EKNWAEX",instance="nas:9633",job="truenas-smart",model_name="M-2EKNWAEX",protocol="ATA",serial_number="2EKNWAEX"}'
        values: '1+0x240'
      - series: 'smartctl_device_smart_status{device="nvme0",instance="nas:9633",job="truenas-smart"}'
        values: '1+0x240'
      - series: 'smartctl_device{device="nvme0",instance="nas:9633",job="truenas-smart",model_name="M-A221116NV012801084",protocol="NVMe",serial_number="A221116NV012801084"}'
        values: '1+0x240'
    alert_rule_test:
      - eval_time: 20m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: TrueNASDiskMissing
        exp_alerts:
          - exp_labels:
              severity: 'warning'
