      - eval_time: 30m
        alertname: TrueNASTextfileError
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              instance: 'nas:9100'
              job: 'truenas-node'
            exp_annotations:
              description: 'A malformed zpool.prom. Check the sidecar''s output.'
              summary: 'node_exporter cannot read the TrueNAS text file'
