# Unit test for the TargetDown copy in prometheusrule-guardrails.yaml (the chart's rule is disabled).
rule_files:
  - guardrails.rules.yaml
evaluation_interval: 30s
tests:
  - name: 'TargetDown ignores the TrueNAS jobs and still fires for other jobs'
    interval: 30s
    input_series:
      - series: 'up{job="truenas-node",instance="a"}'
        values: '0+0x120'
      - series: 'up{job="truenas-smart",instance="b"}'
        values: '0+0x120'
      - series: 'up{job="other",namespace="x",service="svc",instance="c"}'
        values: '0+0x120'
      - series: 'up{job="other",namespace="x",service="svc",instance="d"}'
        values: '1+0x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 12m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              job: 'other'
              namespace: 'x'
              service: 'svc'
            exp_annotations:
              description: '50% of the other/svc targets in x namespace are down.'
              runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/general/targetdown'
              summary: 'One or more targets are unreachable.'
