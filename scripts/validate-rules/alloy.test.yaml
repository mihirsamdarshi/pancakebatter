# Unit tests for prometheusrule-alloy.yaml, run by scripts/validate-kubernetes.sh with promtool.
# Series use the Alloy metric names (loki_write_*, loki_process_*, loki_source_syslog_*); the names are
# confirmed against a running Alloy v1.21.1 in the live checks. Time constants are the real ones.
rule_files:
  - alloy.rules.yaml
evaluation_interval: 1m
tests:
  - name: 'a source goes over its line cap: dropped lines alert, per component'
    interval: 1m
    input_series:
      - series: 'loki_process_dropped_lines_total{component_id="loki.process.syslog",reason="ratelimit_drop_stage"}'
        values: '0+0x10 5+5x50'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
      - eval_time: 20m
        alertname: AlloyLinesRateLimited
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              component_id: 'loki.process.syslog'
            exp_annotations:
              description: 'A source went over its line-rate cap. Lines dropped for being over the size limit or for coming from a sender that is not allowed are not counted; see loki_process_dropped_lines_total by reason. Expect this once after a TrueNAS reboot (boot burst) and when a new app runs its first backup; otherwise find the noisy source.'
              summary: 'Alloy dropped log lines in loki.process.syslog'
  - name: 'size-limit drops do not alert'
    interval: 1m
    input_series:
      - series: 'loki_process_dropped_lines_total{component_id="loki.process.syslog",reason="drop_stage"}'
        values: '0+0x10 5+5x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
      - eval_time: 55m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
  - name: 'only source-filter drops: nothing fires'
    interval: 1m
    input_series:
      - series: 'loki_process_dropped_lines_total{component_id="loki.process.truenas",reason="source_not_allowed"}'
        values: '0+0x10 50+50x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
      - eval_time: 55m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
  - name: 'no dropped lines: quiet'
    interval: 1m
    input_series:
      - series: 'loki_process_dropped_lines_total{component_id="loki.process.syslog"}'
        values: '3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AlloyLinesRateLimited
        exp_alerts: []
  - name: 'Alloy gives up on entries'
    interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total'
        values: '0+0x10 4+4x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlloyWriteDropping
        exp_alerts: []
      - eval_time: 20m
        alertname: AlloyWriteDropping
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              description: 'Loki was unreachable or refused them for longer than Alloy retries. The entries are lost (accepted: logs may be lost).'
              summary: 'Alloy gave up on log entries it could not send to Loki'
  - name: 'pushes are retried for 20 minutes'
    interval: 1m
    input_series:
      - series: 'loki_write_batch_retries_total'
        values: '0+3x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlloyWriteRetrying
        exp_alerts: []
      - eval_time: 20m
        alertname: AlloyWriteRetrying
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              description: 'Loki is unreachable, slow, or answering 429 (the byte cap) or 5xx.'
              summary: 'Alloy keeps retrying pushes to Loki'
  - name: 'no retries'
    interval: 1m
    input_series:
      - series: 'loki_write_batch_retries_total'
        values: '7+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: AlloyWriteRetrying
        exp_alerts: []
  - name: 'syslog parsing errors'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_parsing_errors_total{component_id="loki.source.syslog.truenas"}'
        values: '0+0x10 2+2x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: SyslogParsingErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: SyslogParsingErrors
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              component_id: 'loki.source.syslog.truenas'
            exp_annotations:
              description: 'A sender uses another format or framing than the listener expects (TrueNAS: RFC 5424, octet counting; UCG: RFC 3164).'
              summary: 'Alloy cannot parse syslog messages in loki.source.syslog.truenas'
  - name: 'no syslog parsing errors'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_parsing_errors_total{component_id="loki.source.syslog.ucg"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SyslogParsingErrors
        exp_alerts: []
  - name: 'TrueNASLogsSilent: no TrueNAS syslog counter at all (only the UCG listener counts): fires after 6 hours'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.ucg"}'
        values: '0+5x420'
    alert_rule_test:
      - eval_time: 5h50m
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 6h10m
        alertname: TrueNASLogsSilent
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              summary: 'No syslog lines from TrueNAS for 6 hours'
              description: "The receiver got no line from TrueNAS (192.168.10.75, TCP 514) for 6 hours, or its counter is missing. Check that syslog-ng is active on TrueNAS and its syslog server is still 192.168.10.12 (TCP), and that alloy-receiver runs. A line from any other source address is dropped by the receiver's network policy without a count, so this alert is the only sign of it. Receipt is not storage: AlloyWriteDropping shows lines Alloy could not hand to Loki."
  - name: 'TrueNASLogsSilent: counter present but flat, the state before TrueNAS sends: fires after 6 hours'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.truenas"}'
        values: '0+0x420'
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.ucg"}'
        values: '0+5x420'
    alert_rule_test:
      - eval_time: 5h50m
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 6h10m
        alertname: TrueNASLogsSilent
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              summary: 'No syslog lines from TrueNAS for 6 hours'
              description: "The receiver got no line from TrueNAS (192.168.10.75, TCP 514) for 6 hours, or its counter is missing. Check that syslog-ng is active on TrueNAS and its syslog server is still 192.168.10.12 (TCP), and that alloy-receiver runs. A line from any other source address is dropped by the receiver's network policy without a count, so this alert is the only sign of it. Receipt is not storage: AlloyWriteDropping shows lines Alloy could not hand to Loki."
  - name: 'TrueNASLogsSilent: TrueNAS lines arrive: quiet'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.truenas"}'
        values: '0+30x420'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 7h
        alertname: TrueNASLogsSilent
        exp_alerts: []
  - name: 'TrueNASLogsSilent: TrueNAS stops after 2 hours: the 1-hour rate is 0 from 3h, fires at 9h'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.truenas"}'
        values: '0+30x120 3600+0x450'
    alert_rule_test:
      - eval_time: 8h50m
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 9h10m
        alertname: TrueNASLogsSilent
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              summary: 'No syslog lines from TrueNAS for 6 hours'
              description: "The receiver got no line from TrueNAS (192.168.10.75, TCP 514) for 6 hours, or its counter is missing. Check that syslog-ng is active on TrueNAS and its syslog server is still 192.168.10.12 (TCP), and that alloy-receiver runs. A line from any other source address is dropped by the receiver's network policy without a count, so this alert is the only sign of it. Receipt is not storage: AlloyWriteDropping shows lines Alloy could not hand to Loki."
  - name: 'TrueNASLogsSilent: the receiver restarts (counter reset) while TrueNAS keeps sending: quiet'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.truenas"}'
        values: '0+30x200 0+30x300'
    alert_rule_test:
      - eval_time: 7h
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 8h
        alertname: TrueNASLogsSilent
        exp_alerts: []
  - name: 'TrueNASLogsSilent: the counter disappears after 1 hour (receiver gone): absent from ~1h05m, fires ~7h05m'
    interval: 1m
    input_series:
      - series: 'loki_source_syslog_entries_total{component_id="loki.source.syslog.truenas"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 6h55m
        alertname: TrueNASLogsSilent
        exp_alerts: []
      - eval_time: 7h15m
        alertname: TrueNASLogsSilent
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              summary: 'No syslog lines from TrueNAS for 6 hours'
              description: "The receiver got no line from TrueNAS (192.168.10.75, TCP 514) for 6 hours, or its counter is missing. Check that syslog-ng is active on TrueNAS and its syslog server is still 192.168.10.12 (TCP), and that alloy-receiver runs. A line from any other source address is dropped by the receiver's network policy without a count, so this alert is the only sign of it. Receipt is not storage: AlloyWriteDropping shows lines Alloy could not hand to Loki."
