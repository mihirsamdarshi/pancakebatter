# Unit tests for the external-secrets PrometheusRule, run by scripts/validate-kubernetes.sh with promtool.
# Series use the names and labels the ESO v2.14.0 controller publishes
# (externalsecret_status_condition with name, namespace, condition, status;
# read in esmetrics.go). The job label is the Service name of the chart's
# metrics Service for a release named external-secrets. The namespace and name
# labels on externalsecret_status_condition are the ExternalSecret's own; the
# ServiceMonitor sets honorLabels: true so Prometheus keeps them.
rule_files:
  - external-secrets.rules.yaml
evaluation_interval: 1m
tests:
  - name: 'an ExternalSecret stays not Ready: alert after 15 minutes'
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="media",name="canary",condition="Ready",status="False"}'
        values: '0x5 1x40'
      - series: 'externalsecret_status_condition{namespace="media",name="canary",condition="Ready",status="True"}'
        values: '1x5 0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExternalSecretNotReady
        exp_alerts: []
      - eval_time: 30m
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              namespace: 'media'
              name: 'canary'
              condition: 'Ready'
              status: 'False'
            exp_annotations:
              summary: 'ExternalSecret media/canary is not Ready'
              description: 'The last refresh failed. The Kubernetes Secret it manages keeps its last value. Check the store, the 1Password item and field names, and the service account token. Failed retries also spend the 1Password daily request cap.'
  - name: 'a healthy ExternalSecret does not alert'
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="media",name="canary",condition="Ready",status="False"}'
        values: '0x40'
      - series: 'externalsecret_status_condition{namespace="media",name="canary",condition="Ready",status="True"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ExternalSecretNotReady
        exp_alerts: []
  - name: 'the controller target disappears: alert after 10 minutes'
    interval: 1m
    input_series:
      - series: 'up{job="external-secrets-metrics",namespace="external-secrets"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: ExternalSecretsDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalSecretsDown
        exp_alerts:
          - exp_labels:
              severity: 'warning'
            exp_annotations:
              summary: 'The External Secrets controller is not being scraped'
              description: 'The controller is down or Prometheus cannot reach port 8080. Existing Secrets keep working; nothing refreshes.'
