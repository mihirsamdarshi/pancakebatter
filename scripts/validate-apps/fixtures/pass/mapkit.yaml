---
# Test fixture for scripts/validate-apps.sh: the mapkit part beside a job and
# the family route. The self-test gives its Namespace folder a stand-in Secret.
# mapkit-secret: stand-in
# Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-mapkit
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/mapkit
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: mapkit
    parts: [pullsecret, internal-route, family-route, job, job-egress, mapkit]
    egress: claude-proxy
    vars:
      FAMILY_HOST: maps
      JOB_SCHEDULE: "0 12 * * 0"
      JOB_COMMAND: bun jobs/refresh.ts west-la
      JOB_READ_PATH: content
      JOB_WORK_PATH: feeds
      JOB_EGRESS_CIDR: 203.0.113.0/24
