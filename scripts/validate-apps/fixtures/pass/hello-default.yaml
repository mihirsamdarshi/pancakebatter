---
# Test fixture for scripts/validate-apps.sh: the hello entry (default parts, SQLite
# backup), in an existing namespace. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-hello-default
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/hello-default
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: hello-default
    namespace: quilt-planner
    parts: [pullsecret, internal-route, backup, backup-sqlite]
    vars:
      SQLITE_DBS: hello.db
      VOLSYNC_SCHEDULE: "15 12 * * *"
      SQLITE_SCHEDULE: "5 12 * * *"
