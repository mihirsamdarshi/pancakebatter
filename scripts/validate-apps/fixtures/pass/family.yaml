---
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-family
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/family
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: family
    namespace: quilt-planner
    parts: [pullsecret, internal-route, family-route, family-route-legacy, backup, backup-sqlite]
    vars:
      FAMILY_HOST: fam
      SQLITE_DBS: a.db sub/b.db
      VOLSYNC_SCHEDULE: "35 9 * * *"
      SQLITE_SCHEDULE: "25 9 * * *"
