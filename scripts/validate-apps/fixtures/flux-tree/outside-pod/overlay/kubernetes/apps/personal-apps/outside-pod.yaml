---
# Rejected: a second pod labelled cloudflared in the tunnel's namespace, from
# outside its folder. The share policy would admit it to the guest port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helper
  namespace: reports-share
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: c
          image: docker.io/cloudflare/cloudflared:latest
          args: [tunnel, --url, http://reports-share.reports.svc.cluster.local:3001]
