---
# Rejected: the app pod carries the job pod label, which the job-egress policy
# selects, so the app would get the job's egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP}-job
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP}-job
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: apps-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/mihirsamdarshi/apps/${APP}@${IMAGE_DIGEST}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
