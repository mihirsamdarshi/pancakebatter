---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-platform
spec:
  dependsOn:
    - name: flux-operator
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/apps/flux-system/app-platform
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: false
