---
# expect: expected exactly one CiliumNetworkPolicy
# mutate: map(if .kind=="CiliumNetworkPolicy" then ., (. | .metadata.name="integrations-policy-without-part-integrations") else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-integrations-policy-without-part
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/integrations-policy-without-part
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: integrations-policy-without-part
    parts: [pullsecret, internal-route]
