---
# expect: unknown spec key serviceAccountName
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-rsip-serviceaccount
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/rsip-serviceaccount
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  serviceAccountName: flux-operator
  defaultValues:
    name: rsip-serviceaccount
    namespace: quilt-planner
    parts: [pullsecret, internal-route]
