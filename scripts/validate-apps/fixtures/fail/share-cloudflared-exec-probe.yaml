---
# expect: containers.0.livenessProbe.exec
# share-files: exec-probe
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-cloudflared-exec-probe
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-cloudflared-exec-probe
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-cloudflared-exec-probe
    parts: [pullsecret, internal-route, share, share-admin]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
