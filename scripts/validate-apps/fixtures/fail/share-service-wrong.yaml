---
# expect: must be a ClusterIP Service that exposes only port 3001
# mutate: map(if .kind=="Service" and .metadata.name=="share-service-wrong-share" then .spec.ports += [{"name":"main","port":3000,"targetPort":"http"}] else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-service-wrong
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-service-wrong
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-service-wrong
    parts: [pullsecret, internal-route, share, share-admin]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
