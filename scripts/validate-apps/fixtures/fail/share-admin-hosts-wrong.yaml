---
# expect: share must give container app of Deployment share-admin-hosts-wrong exactly SHARE_ADMIN_HOSTS
# mutate: map(if .kind=="Deployment" and .metadata.name=="share-admin-hosts-wrong" then .spec.template.spec.containers[0].env |= map(if .name=="SHARE_ADMIN_HOSTS" then .value="share-admin-hosts-wrong.local.example.test,view.example.test" else . end) else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-admin-hosts-wrong
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-admin-hosts-wrong
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-admin-hosts-wrong
    parts: [pullsecret, internal-route, share, share-admin]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
