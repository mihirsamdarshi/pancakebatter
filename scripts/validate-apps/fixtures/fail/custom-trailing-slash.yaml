---
# expect: path must not end with a slash
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-custom-trailing-slash
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/custom-trailing-slash
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: custom-trailing-slash
    namespace: quilt-planner
    path: ./kubernetes/apps/personal/hello/app/
