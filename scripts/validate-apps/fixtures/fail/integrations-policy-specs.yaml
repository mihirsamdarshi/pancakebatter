---
# expect: the integrations policy
# mutate: map(if .kind=="CiliumNetworkPolicy" and .metadata.name=="integrations-policy-specs-integrations" then .specs = [{"endpointSelector": {}, "ingress": [{"fromEntities": ["cluster"]}]}] else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-integrations-policy-specs
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/integrations-policy-specs
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: integrations-policy-specs
    parts: [pullsecret, internal-route, integrations]
