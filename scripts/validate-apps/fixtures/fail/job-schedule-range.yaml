---
# expect: vars.JOB_SCHEDULE 0 99 * * 9 has a field out of range
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-job-schedule-range
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/job-schedule-range
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: job-schedule-range
    parts: [pullsecret, internal-route, job]
    vars:
      JOB_SCHEDULE: "0 99 * * 9"
      JOB_COMMAND: bun jobs/refresh.ts
      JOB_READ_PATH: content
      JOB_WORK_PATH: feeds
