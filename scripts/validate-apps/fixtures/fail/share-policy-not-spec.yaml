---
# expect: the share policy
# mutate: map(if .kind=="CiliumNetworkPolicy" and .metadata.name=="share-policy-not-spec-share" then .spec.ingress[0].toPorts[0].ports += [{"port":"3000","protocol":"TCP"}] else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-policy-not-spec
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-policy-not-spec
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-policy-not-spec
    parts: [pullsecret, internal-route, share]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
