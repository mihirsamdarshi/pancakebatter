---
# expect: share must give container app of Deployment share-env-seed-emails exactly
# mutate: map(if .kind=="Deployment" and .metadata.name=="share-env-seed-emails" then .spec.template.spec.containers[0].env += [{"name":"GUEST_SEED_EMAILS","value":"a@example.test"}] else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-env-seed-emails
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-env-seed-emails
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-env-seed-emails
    parts: [pullsecret, internal-route, share, share-admin]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
