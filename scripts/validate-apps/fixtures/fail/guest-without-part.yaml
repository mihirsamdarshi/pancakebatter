---
# expect: GUEST_ variables, SHARE_ADMIN_HOSTS or port 3001 on the app container without the share part
# mutate: map(if .kind=="Deployment" then .spec.template.spec.containers[0].env += [{"name":"GUEST_PORT","value":"3001"}] else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-guest-without-part
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/guest-without-part
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: guest-without-part
    parts: [pullsecret, internal-route]

