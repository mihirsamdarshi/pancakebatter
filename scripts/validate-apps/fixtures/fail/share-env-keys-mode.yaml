---
# expect: share must give container app of Deployment share-env-keys-mode exactly
# mutate: map(if .kind=="Deployment" and .metadata.name=="share-env-keys-mode" then .spec.template.spec.containers[0].env |= map(if .name=="GUEST_ACCESS_MODE" then .value="keys" else . end) else . end)
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-env-keys-mode
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-env-keys-mode
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-env-keys-mode
    parts: [pullsecret, internal-route, share]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
