---
# expect: CronJob/${APP}-reader: secretKeyRef is forbidden
# mapkit-secret: stand-in
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-mapkit-ref-on-cronjob
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/mapkit-ref-on-cronjob
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: mapkit-ref-on-cronjob
    parts: [pullsecret, internal-route, mapkit]
    path: ./scripts/validate-apps/fixtures/custom/mapkit-cronjob
