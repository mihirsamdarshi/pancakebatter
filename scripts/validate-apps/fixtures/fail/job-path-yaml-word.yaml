---
# expect: vars.JOB_READ_PATH must be a relative path that starts with a letter, without .. or hidden segments, and not a YAML boolean or null word
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-job-path-yaml-word
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/job-path-yaml-word
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: job-path-yaml-word
    parts: [pullsecret, internal-route, job]
    vars:
      JOB_SCHEDULE: "0 11 * * 0"
      JOB_COMMAND: bun jobs/refresh.ts
      JOB_READ_PATH: "yes"
      JOB_WORK_PATH: feeds
