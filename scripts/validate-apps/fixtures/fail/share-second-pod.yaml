---
# expect: which only the app Deployment may carry with the share part
# mutate: . + [(.[] | select(.kind=="Deployment" and .metadata.name=="share-second-pod") | .metadata.name = "share-second-pod-extra")]
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-share-second-pod
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/share-second-pod
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: share-second-pod
    parts: [pullsecret, internal-route, share]
    vars:
      SHARE_HOST: view
      GUEST_COLLECTIONS: alpha
