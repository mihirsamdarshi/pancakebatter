---
# expect: a stringData value is not SOPS-encrypted
# mapkit-secret: plain
# Test fixture for scripts/validate-apps.sh. Never applied to a cluster.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-mapkit-secret-plain
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/mapkit-secret-plain
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: mapkit-secret-plain
    parts: [pullsecret, internal-route, mapkit]
    egress: claude-proxy
