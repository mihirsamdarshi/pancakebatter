---
# Nightly restic backup of one app's config PVC to the NFS repository.
#
# Direct copy: local-path has no CSI snapshots, so the mover mounts the live
# PVC. VolSync puts the mover on the app pod's node (a hostname nodeSelector
# plus the pod's tolerations), which an RWO local volume needs.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: ${VOLSYNC_CLAIM}
  trigger:
    # UTC: 10:00 is 03:00 Pacific in summer, 02:00 in winter.
    schedule: "${VOLSYNC_SCHEDULE:=0 10 * * *}"
  restic:
    repository: ${APP}-volsync
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    # The restic metadata cache is a PVC; there is no default StorageClass.
    cacheCapacity: 512Mi
    cacheStorageClassName: local-path
    # The mover runs as the app's user, so that a restore can replace the app's
    # files (restic cannot change ownership without root). The extra group 568
    # is the TrueNAS `apps` group, which owns the repository share (mode 770).
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: ${APP_UID:=568}
      runAsGroup: ${APP_GID:=568}
      fsGroup: ${APP_GID:=568}
      supplementalGroups:
        - 568
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Mounted at /mnt/repo; RESTIC_REPOSITORY in the secret points below it.
    moverVolumes:
      - mountPath: repo
        volumeSource:
          persistentVolumeClaim:
            claimName: ${APP}-volsync-repo
