---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-internal
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - ${HOST:=${APP}}.${SECRET_DOMAIN_LOCAL}
  rules:
    # Two named rules so backendtrafficpolicy.yaml can switch retries off for
    # writes only. GET and HEAD are more specific than the catch-all, so they
    # always land on `reads`.
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: ${APP}
          port: 80
    - name: writes
      backendRefs:
        - name: ${APP}
          port: 80
