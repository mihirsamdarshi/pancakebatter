---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-internal
  # The LAN dashboard (personal-apps/homepage, Gateway API discovery) lists
  # every platform app from these annotations; only the internal route carries
  # them, so the family start page never shows platform apps. `external` makes
  # Homepage skip the pod-status lookup (it needs no access to pods or
  # namespaces); the status dot comes from siteMonitor instead, like the
  # hand-written tiles. TITLE, DESCRIPTION and ICON are entry vars.
  #
  # Flux substitutes after kustomize has re-serialized this file, and kustomize
  # drops quotes it considers unnecessary, so quoting a ${...} here does not
  # keep the result a string. Every substituted value below must read as a plain
  # one-line YAML string on its own; scripts/validate-apps.sh enforces that for
  # TITLE, DESCRIPTION, ICON and the app name. Annotation values that are not
  # strings make the API server reject the whole app Kustomization.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: ${TITLE:=${APP}}
    gethomepage.dev/description: ${DESCRIPTION:=Platform app}
    gethomepage.dev/icon: ${ICON:=mdi-application}
    gethomepage.dev/href: https://${HOST:=${APP}}.${SECRET_DOMAIN_LOCAL}
    gethomepage.dev/siteMonitor: https://${HOST:=${APP}}.${SECRET_DOMAIN_LOCAL}
    gethomepage.dev/external: "true"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - ${HOST:=${APP}}.${SECRET_DOMAIN_LOCAL}
  rules:
    # Two named rules so backendtrafficpolicy.yaml can switch retries off for
    # writes only. GET and HEAD are more specific than the catch-all, so they
    # always land on `reads`.
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: ${APP}
          port: 80
    - name: writes
      backendRefs:
        - name: ${APP}
          port: 80
