---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-family
spec:
  parentRefs:
    # No sectionName: each hostname attaches to the envoy-family listener that
    # serves it.
    - name: envoy-family
      namespace: network
  hostnames:
    - ${FAMILY_HOST}.${SECRET_FAMILY_DOMAIN}
  rules:
    # Two named rules so backendtrafficpolicy.yaml can switch retries off for
    # writes only (see internal-route).
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: ${APP}
          port: 80
    - name: writes
      backendRefs:
        - name: ${APP}
          port: 80
