---
# Same shape and reason as internal-route/backendtrafficpolicy.yaml: no
# retries for writes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ${APP}-family-writes
spec:
  mergeType: StrategicMerge
  retry:
    numRetries: 0
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}-family
      sectionName: writes
