---
# Same shape and reason as internal-route/backendtrafficpolicy.yaml: no
# retries for writes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ${APP}-family-writes
spec:
  mergeType: StrategicMerge
  retry:
    numRetries: 0
  # Envoy closes an idle upstream connection at 60 s, before the app's keep-alive
  # (the template sets 75 s), so a write never lands on a closing connection.
  timeout:
    http:
      connectionIdleTimeout: 60s
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}-family
      sectionName: writes
