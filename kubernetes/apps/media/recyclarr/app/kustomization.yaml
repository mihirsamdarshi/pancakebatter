---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: recyclarr-config
    files:
      - ./recyclarr.yml
generatorOptions:
  # The CronJob references the name, and a new Job reads the file anyway.
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
