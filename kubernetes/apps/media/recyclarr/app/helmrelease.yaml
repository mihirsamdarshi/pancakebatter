---
# Syncs TRaSH Guide quality profiles, custom formats and quality sizes into
# Sonarr and Radarr once a day. Stateless on purpose: /config is an emptyDir
# (each run re-clones the guides, and Recyclarr re-adopts existing profiles
# and custom formats by name), and the config is mounted read-only from the
# recyclarr-config ConfigMap. The API keys are read from the sonarr and radarr
# Secrets. Run it by hand with:
#   kubectl -n media create job --from=cronjob/recyclarr recyclarr-manual
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    defaultPodOptions:
      restartPolicy: Never
      # The image's own user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: "@daily"
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 3600
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
          backoffLimit: 2
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
            # With arguments the entrypoint runs the CLI once instead of
            # starting its own cron loop.
            args:
              - sync
            env:
              TZ: Etc/UTC
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      config:
        type: emptyDir
        advancedMounts:
          recyclarr:
            app:
              - path: /config
      configs:
        type: configMap
        name: recyclarr-config
        advancedMounts:
          recyclarr:
            app:
              - path: /config/configs
                readOnly: true
