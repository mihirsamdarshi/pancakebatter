---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
spec:
  dependsOn:
    - name: local-path-provisioner
      namespace: storage
    - name: nvidia-device-plugin
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/media/jellyfin/app
  postBuild:
    substitute:
      APP: jellyfin
      # Only the config volume: jellyfin-metadata is artwork that a library
      # refresh fetches again.
      VOLSYNC_CLAIM: jellyfin-config
      VOLSYNC_NAMESPACE: media
      VOLSYNC_SCHEDULE: "0 10 * * *"
      # Jellyfin 12 keeps its library, users and watch state in this WAL-mode
      # database. The export runs ten minutes before the backup.
      SQLITE_DBS: data/jellyfin.db
      SQLITE_SCHEDULE: "50 9 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
