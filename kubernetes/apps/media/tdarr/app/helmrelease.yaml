---
# Server plus the internal node (the only node), on talos-01 with one GPU slice.
#  - Login: the secret tdarr-secret (SOPS) seeded the admin user at first start:
#    user `admin`, password = the seeded key (seededApiKey, format tapi_...).
#    Read the key with:
#    sops -d --extract '["stringData"]["seededApiKey"]' kubernetes/apps/media/tdarr/app/secret.sops.yaml
#    The UI is at tdarr.${SECRET_DOMAIN_LOCAL} (internal gateway only).
#  - The internal node authenticates with the same key: env apiKey comes from
#    tdarr-secret/seededApiKey (docs: a seeded key is valid as a node key; the
#    env var overrides the node config file). Changing the admin password
#    later does not change the key.
#  - Workers are seeded by env on the node's first start (documented env vars
#    transcodegpuWorkers / transcodecpuWorkers / healthcheckgpuWorkers /
#    healthcheckcpuWorkers, added in Tdarr 2.21.01): 1 GPU transcode,
#    0 CPU transcode, 0 GPU health check, 1 CPU health check. They can be
#    changed later in the UI.
#  - The 04:00-10:00 transcode window has NO env or file setting: it is the
#    node schedule in the UI (Nodes tab, the node's Options -> Schedule),
#    stored in the server database. TZ below makes the pod clock local time;
#    Tdarr schedules follow the server clock. One-time steps after the node
#    registers: untick every hour except 04, 05, 06, 07, 08 and 09 on every
#    day, so workers run only 04:00-10:00. Check the server time on the
#    dashboard first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  chartRef:
    kind: OCIRepository
    name: tdarr
  interval: 1h
  values:
    defaultPodOptions:
      # The state PVC and the GPU are both on talos-01. The GPU is time-sliced
      # (2 slices): Jellyfin holds one, the internal node the other.
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-01
      # Tdarr 3.01+ runs as any uid: PUID/PGID are ignored and nothing is
      # chowned. A uid other than 1000 needs group 0 and a /run tmpfs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 0
    controllers:
      tdarr:
        # RWO state volume and one GPU slice: no overlapping pods.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 3.03.00@sha256:2eaa0bf43703f61cb72c63980f4799ece6ead372508891f69e5a1441c110b442
            env:
              TZ: America/Los_Angeles
              UMASK: "002"
              serverIP: 0.0.0.0
              serverPort: &serverPort 8266
              webUIPort: &webPort 8265
              internalNode: "true"
              nodeName: talos-01-gpu
              transcodegpuWorkers: "1"
              transcodecpuWorkers: "0"
              healthcheckgpuWorkers: "0"
              healthcheckcpuWorkers: "1"
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
              inContainer: "true"
              auth: "true"
              openBrowser: "false"
              maxLogSizeMB: "10"
              apiKey:
                valueFrom:
                  secretKeyRef:
                    name: tdarr-secret
                    key: seededApiKey
            envFrom:
              - secretRef:
                  name: tdarr-secret
            probes:
              # tcpSocket: GET / serves the whole UI.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *webPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *webPort
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 4
                memory: 4Gi
                nvidia.com/gpu: 1
    service:
      tdarr:
        controller: tdarr
        ports:
          http:
            port: *webPort
          server:
            port: *serverPort
    route:
      tdarr:
        hostnames:
          - tdarr.${SECRET_DOMAIN_LOCAL}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: tdarr
                port: *webPort
    persistence:
      # One 2Gi claim with three subPaths: one volume to retain and back up,
      # and the three directories cannot drift apart.
      state:
        type: persistentVolumeClaim
        storageClass: local-retain
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        advancedMounts:
          tdarr:
            app:
              - path: /app/server
                subPath: server
              - path: /app/configs
                subPath: configs
              - path: /app/logs
                subPath: logs
      # Test library only: /data/tdarr/test-in (source) and test-out (output).
      data:
        type: persistentVolumeClaim
        existingClaim: tdarr-data
        advancedMounts:
          tdarr:
            app:
              - path: /data/tdarr
      run:
        type: emptyDir
        medium: Memory
        advancedMounts:
          tdarr:
            app:
              - path: /run
      # Transcode scratch on the node's local disk, not on the HDD pool.
      # talos-01's local-path disk is 69 GB and shares it with Jellyfin's
      # 20Gi transcode cap; 15Gi leaves room. Exceeding it evicts the pod.
      temp:
        type: emptyDir
        sizeLimit: 15Gi
        advancedMounts:
          tdarr:
            app:
              - path: /temp
