---
# The tdarr admin key (the seeded API key), from 1Password item `tdarr` in vault
# `Homelab`. Key format <item>/<field> (ESO 2.14 onepasswordSDK provider), so
# `tdarr/seededApiKey` is the field labelled seededApiKey. The HelmRelease reads
# the Secret this makes (tdarr-secret-eso).
#  - Never rename target.name: Tdarr references it, and a new name makes a new Secret.
#  - refreshPolicy CreatedOnce: ESO syncs once and stops, so an edit of the
#    1Password field is NOT picked up. Changing the key is a deliberate step:
#    edit the 1Password field, then delete this ExternalSecret's Secret
#    (ESO re-creates it from 1Password), then restart Tdarr. Deleting the
#    ExternalSecret object itself also re-syncs and overwrites the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-secret-eso
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: tdarr-secret-eso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: seededApiKey
      remoteRef:
        key: tdarr/seededApiKey
