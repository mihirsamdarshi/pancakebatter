---
# The tdarr admin key (the seeded API key), from 1Password item `tdarr` in vault
# `Homelab`. Key format <item>/<field> (ESO 2.14 onepasswordSDK provider), so
# `tdarr/seededApiKey` is the field labelled seededApiKey. The HelmRelease reads
# the Secret this makes (tdarr-secret-eso).
#  - Never rename target.name: Tdarr references tdarr-secret-eso, and with
#    creationPolicy Owner ESO deletes that Secret as soon as the name changes.
#  - refreshPolicy CreatedOnce: ESO syncs once and never reads 1Password for
#    this Secret again; the force-sync annotation does nothing. Tdarr wrote the
#    seeded key into its database at first start, so editing the 1Password
#    field does not change the key in Tdarr. Leave the field alone.
#  - Changing the key is not tested. It would have to start inside Tdarr (make
#    the new key valid there first). Only then: put the same value in the
#    1Password field, delete the Secret tdarr-secret-eso (ESO re-creates it),
#    check this ExternalSecret is Ready and the Secret exists, restart Tdarr.
#  - Never delete this ExternalSecret: with Owner, Kubernetes deletes its
#    Secret too, and Flux re-creates both only at its next sync (up to 1h),
#    from whatever 1Password holds then.
#  - CreatedOnce also freezes target settings: a change to creationPolicy or
#    immutable reaches the Secret only when the Secret is re-created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-secret-eso
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: tdarr-secret-eso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: seededApiKey
      remoteRef:
        key: tdarr/seededApiKey
