---
# Stage 1 of moving tdarr-secret to 1Password: this Secret sits beside the SOPS
# one (tdarr-secret) and nothing reads it yet. Key format <item>/<field> (ESO
# 2.14 onepasswordSDK provider), so `tdarr/seededApiKey` is the field labelled
# seededApiKey on the item `tdarr` in vault `Homelab`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-secret-eso
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: tdarr-secret-eso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: seededApiKey
      remoteRef:
        key: tdarr/seededApiKey
