---
# Throwaway check of the 1Password path: no pod uses this Secret. The 1Password
# item `eso-canary` (a Password item in vault `Homelab`) is made by the owner;
# until it exists this ExternalSecret reports not Ready and nothing else
# depends on it. The 1h interval keeps the store (no cache) within the daily
# request quota; use the force-sync annotation to refresh sooner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-canary
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: eso-canary
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: eso-canary/password
