---
# Trawl: a FlareSolverr-compatible challenge solver (POST /v1 on 8191) for
# Prowlarr indexers behind Cloudflare. It has no authentication, so it is
# cluster-internal only: a ClusterIP Service, no route, and a network policy
# that admits Prowlarr alone. Stateless: no PVC, in-memory session cache.
#
# In Prowlarr (a setting, not a manifest): Settings > Indexers > add an Indexer
# Proxy of type FlareSolverr, host http://trawl.media.svc.cluster.local:8191,
# with a tag; give that tag only to the indexers that need it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trawl
spec:
  chartRef:
    kind: OCIRepository
    name: trawl
  interval: 1h
  values:
    defaultPodOptions:
      # The image sets no USER (root); it also runs as an arbitrary UID with
      # HOME=/tmp (tested as 568 with a read-only root and a tmpfs /tmp).
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      trawl:
        containers:
          app:
            image:
              repository: ghcr.io/germondai/trawl
              tag: 1.9.3@sha256:c46f74dfde3df278ff3dc5357f78df1109dfddd9aef754b4dcba1ac98f6fc6ae
            env:
              TZ: Etc/UTC
              SESSION_CACHE_DRIVER: memory
              BROWSER_POOL_SIZE: "1"
              MCP_ENABLED: "false"
              METRICS_DASHBOARD_ENABLED: "false"
              MITM_ENABLED: "false"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8191
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # 1536Mi was OOMKilled 8 times in a day while solving challenges.
                memory: 3Gi
    service:
      trawl:
        controller: trawl
        ports:
          http:
            port: *port
    persistence:
      # Firefox needs shared memory; the container default of 64Mi crashes it.
      # Memory-backed, so it counts against the 3Gi container limit.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          trawl:
            app:
              - path: /dev/shm
      # HOME=/tmp: browser profiles and scratch files.
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        advancedMounts:
          trawl:
            app:
              - path: /tmp
