---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prowlarr
spec:
  dependsOn:
    - name: local-path-provisioner
      namespace: storage
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/media/prowlarr/app
  postBuild:
    substitute:
      APP: prowlarr
      # The chart's only PVC, so it is named after the release.
      VOLSYNC_CLAIM: prowlarr
      VOLSYNC_NAMESPACE: media
      VOLSYNC_SCHEDULE: "15 11 * * *"
      # Prowlarr's WAL-mode databases. The Servarr wiki says to stop the app before
      # copying them, so the live files are not trusted. logs.db is exported too:
      # a torn copy of it stops Prowlarr from starting after a restore.
      SQLITE_DBS: prowlarr.db logs.db
      SQLITE_SCHEDULE: "5 11 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
