---
# Static PV so the NFS mount options are explicit. The whole Media export is
# mounted at /data (downloads/ and media/ side by side), the same path
# qBittorrent uses, so imports are hardlinks.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-data
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  nfs:
    server: 192.168.10.75
    path: /mnt/nasty/Media
  claimRef:
    namespace: media
    name: sonarr-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: sonarr-data
  resources:
    requests:
      storage: 1Ti
