---
# Mirror of the chart that backube publishes at https://backube.github.io/helm-charts
# (checked identical for 0.17.0).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volsync
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.17.0
  url: oci://ghcr.io/home-operations/charts-mirror/volsync
