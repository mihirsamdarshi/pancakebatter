---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chartRef:
    kind: OCIRepository
    name: volsync
  interval: 1h
  values:
    # The CRDs ship in the chart and carry helm.sh/resource-policy: keep, so
    # removing the release never deletes the ReplicationSources.
    manageCRDs: true
    metrics:
      # The chart's ServiceMonitor sends no bearer token, so with auth on the
      # scrape would fail with 401.
      disableAuth: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
