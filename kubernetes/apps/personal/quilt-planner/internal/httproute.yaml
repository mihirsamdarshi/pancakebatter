---
# The LAN address. Owned here, not by the app's bundle, so this repo decides
# what is exposed on envoy-internal. The bundle still ships its own route named
# quilt-planner for the same hostname until the app release drops it. Until
# then GET and HEAD match `reads` (the more specific rule), but everything else
# matches both catch-alls and Gateway API prefers the older route, the bundle's,
# so writes only get the no-retry rule once that route is gone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quilt-planner-internal
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - quilts.${SECRET_DOMAIN_LOCAL}
  rules:
    # Two named rules so backendtrafficpolicy.yaml can switch retries off for
    # writes only. GET and HEAD are more specific than the catch-all, so they
    # always land on `reads`.
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: quilt-planner
          port: 80
    - name: writes
      backendRefs:
        - name: quilt-planner
          port: 80
