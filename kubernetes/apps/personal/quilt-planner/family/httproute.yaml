---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quilt-planner-family
spec:
  parentRefs:
    # No sectionName: each hostname attaches to the envoy-family listener that
    # serves it.
    - name: envoy-family
      namespace: network
  hostnames:
    - quilts.${SECRET_FAMILY_DOMAIN}
    # Previous name, kept while clients move over.
    - quilts.family.${SECRET_DOMAIN_LOCAL}
  rules:
    # Two named rules so backendtrafficpolicy.yaml can switch retries off for
    # writes only. GET and HEAD are more specific than the catch-all, so they
    # always land on `reads`.
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: quilt-planner
          port: 80
    - name: writes
      backendRefs:
        - name: quilt-planner
          port: 80
