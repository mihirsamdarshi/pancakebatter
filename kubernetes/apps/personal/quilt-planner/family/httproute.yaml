---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quilt-planner-family
spec:
  parentRefs:
    # No sectionName: each hostname attaches to the envoy-family listener that
    # serves it.
    - name: envoy-family
      namespace: network
  hostnames:
    - quilts.${SECRET_FAMILY_DOMAIN}
    # Previous name, kept while clients move over.
    - quilts.family.${SECRET_DOMAIN_LOCAL}
  rules:
    - backendRefs:
        - name: quilt-planner
          port: 80
