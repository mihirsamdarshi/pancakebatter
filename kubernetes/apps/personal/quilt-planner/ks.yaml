apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-bootstrap
spec:
  interval: 1h
  path: ./kubernetes/apps/personal/quilt-planner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-tailnet
  namespace: quilt-planner
spec:
  dependsOn:
    - name: tailscale-apps
      namespace: tailscale
    - name: quilt-planner
      namespace: quilt-planner
  interval: 1h
  path: ./kubernetes/apps/personal/quilt-planner/tailnet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: true
