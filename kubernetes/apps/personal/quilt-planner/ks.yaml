apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-bootstrap
spec:
  interval: 1h
  path: ./kubernetes/apps/personal/quilt-planner/app
  postBuild:
    substitute:
      APP: quilt-planner
      OCI_REPO: ghcr.io/mihirsamdarshi/quilt-planner-deploy
      # Names from before the shared component, kept so Flux updates these
      # objects in place instead of replacing them.
      RECONCILER_NAME: quilt-reconciler
      REGISTRY_SECRET: quilt-registry
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-tailnet
  namespace: quilt-planner
spec:
  dependsOn:
    - name: tailscale-apps
      namespace: tailscale
    - name: quilt-planner
      namespace: quilt-planner
  interval: 1h
  path: ./kubernetes/apps/personal/quilt-planner/tailnet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: true
---
# Nightly backup of quilt-data. Separate from the app's Kustomization, which
# comes from the OCI bundle. quilt.db is SQLite in WAL mode and is copied while
# the app runs: read the SQLite section of components/volsync/README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-backup
spec:
  dependsOn:
    - name: quilt-planner
      namespace: quilt-planner
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/quilt-planner/backup
  postBuild:
    substitute:
      APP: quilt-planner
      VOLSYNC_CLAIM: quilt-data
      VOLSYNC_SCHEDULE: "15 10 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: false
