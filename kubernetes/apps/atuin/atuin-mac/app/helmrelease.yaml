---
# Atuin sync server for the Macs. The Linux machines have their own server,
# atuin-linux, which shares nothing with this one. Never log a Linux machine in
# here: see ../../README.md.
#
# Registration is closed. The group's one account is made on the server with
# `atuin-server admin user create` (README.md, Registration).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin-mac
spec:
  chartRef:
    kind: OCIRepository
    name: atuin-mac
  interval: 1h
  values:
    defaultPodOptions:
      # The volume is node-local (local-retain), so the server stays on one
      # node: talos-03 here, talos-02 for the Linux machines' server. talos-01
      # is short of memory.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-03
      # The image runs as its `atuin` user, 1000:1000. It names the user rather
      # than the number, so runAsNonRoot needs the number here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      atuin-mac:
        # RWO volume with a single SQLite writer: never two pods at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.24.8@sha256:2bc3a558b236283cd64ce64cf9aa463c24e34f97fc36a4b1a5b2b1853a5dcb49
            args:
              - start
            env:
              ATUIN_HOST: 0.0.0.0
              # Set explicitly. A Service link can inject ATUIN_PORT=tcp://...
              # (the chart turns service links off, but the docs ask for this).
              ATUIN_PORT: "8888"
              # Closed: see the top of this file.
              ATUIN_OPEN_REGISTRATION: "false"
              # The server creates the file on first start.
              ATUIN_DB_URI: sqlite:///config/atuin.db
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8888
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      atuin-mac:
        controller: atuin-mac
        ports:
          http:
            port: *port
    route:
      atuin-mac:
        hostnames:
          - atuin-mac.${SECRET_DOMAIN_LOCAL}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: atuin-mac
                port: *port
    persistence:
      # server.toml (written on first start) and the SQLite database.
      config:
        type: persistentVolumeClaim
        storageClass: local-retain
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        advancedMounts:
          atuin-mac:
            app:
              - path: /config
      # The root filesystem is read-only; SQLite puts its temporary files here.
      tmp:
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          atuin-mac:
            app:
              - path: /tmp
