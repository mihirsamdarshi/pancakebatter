---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # The controller, webhook and cert-controller all run under the restricted
    # profile (the chart defaults already satisfy it). No SOPS component here:
    # the namespace must not hold the cluster-secrets Secret.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
