---
# Selecting every pod in external-secrets turns on default-deny in both
# directions; the rules below add up. Only the controller needs the internet
# (1Password). The CIDR rule is the arc-systems pattern: public addresses only,
# port 443. The repo has no toFQDNs rule and Hubble is off.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets
spec:
  endpointSelector: {}
  ingress:
    # Kubelet probes come from the node.
    - fromEntities:
        - host
    # The API server calls the validating webhook (container port 10250). All
    # three nodes run an API server, so a call from another node arrives as
    # remote-node. The webhook has failurePolicy: Fail, so a missing rule here
    # blocks every ExternalSecret and SecretStore apply.
    - fromEntities:
        - host
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # Prometheus scrapes the controller (same selector as ebay-receiver).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The API server (same rule as arc-systems).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 1Password (the controller's provider): public addresses only. Pods and
    # nodes cannot match a CIDR rule (Cilium runs without policy-cidr-match-mode).
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8 # RFC 1918
            - 172.16.0.0/12 # RFC 1918
            - 192.168.0.0/16 # RFC 1918: the LAN and VLAN 10
            - 100.64.0.0/10 # CGNAT: Tailscale
            - 169.254.0.0/16 # link-local
            - 192.0.0.0/24 # IETF protocol assignments
            - 198.18.0.0/15 # benchmarking
            - 224.0.0.0/3 # multicast and reserved
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
