---
# The store needs the controller's CRDs and webhook, so it is a separate
# Kustomization that waits for the controller. wait: true makes it fail visibly
# if the store does not become Ready (for example a bad service account token).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
spec:
  dependsOn:
    - name: external-secrets
  interval: 1h
  path: ./kubernetes/apps/external-secrets/stores/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-secrets
  timeout: 5m
  wait: true
