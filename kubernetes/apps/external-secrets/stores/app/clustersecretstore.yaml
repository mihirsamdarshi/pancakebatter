---
# One store for the 1Password vault `Homelab` (read-only service account). It is
# vault-wide: any ExternalSecret in a namespace listed under `conditions` can
# read any item in the vault. Add a namespace here only in a reviewed PR, and
# keep the vault for secrets meant for those namespaces.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab
spec:
  conditions:
    - namespaces:
        - media
  provider:
    onepasswordSDK:
      vault: Homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
          namespace: external-secrets
