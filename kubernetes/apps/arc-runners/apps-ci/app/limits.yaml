---
# One job = runner pod (req 50m/256Mi/256Mi, limit 1/1Gi/1Gi) + job pod
# (req 500m/1Gi/1Gi, limit 2/2Gi/6Gi): requests 550m/1.25Gi/1.25Gi, limits
# 3/3Gi/7Gi. Three jobs (maxRunners 3): requests 1.65/3.75Gi/3.75Gi, limits
# 9/9Gi/21Gi. Every line also fits one more job-sized pod (a container-action
# step pod, or a job pod not yet cleaned up after its runner died): the hook
# does not retry on `exceeded quota`, so without that room the job fails.
# Raising the job limit (hook-template.yaml) needs the LimitRange max and the
# quota here raised in the same change.
apiVersion: v1
kind: LimitRange
metadata:
  name: arc-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 6Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runners
spec:
  hard:
    pods: "10"
    requests.cpu: "3"
    requests.memory: 5Gi
    requests.ephemeral-storage: 6Gi
    limits.cpu: "11"
    limits.memory: 11Gi
    limits.ephemeral-storage: 27Gi
