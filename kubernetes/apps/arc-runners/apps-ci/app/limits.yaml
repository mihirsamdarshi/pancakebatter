---
# One job = runner pod (req 50m/256Mi/256Mi, limit 1/1Gi/1Gi) + job pod
# (req 500m/1Gi/1Gi, limit 2/2Gi/6Gi): requests 550m/1.25Gi/1.25Gi, limits
# 3/3Gi/7Gi. Two jobs: requests 1.1/2.5Gi/2.5Gi, limits 6/6Gi/14Gi. The hook
# does not retry on `exceeded quota`, so the quota leaves headroom.
apiVersion: v1
kind: LimitRange
metadata:
  name: arc-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 6Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runners
spec:
  hard:
    pods: "10"
    requests.cpu: "3"
    requests.memory: 5Gi
    requests.ephemeral-storage: 6Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    limits.ephemeral-storage: 20Gi
