---
# A selected endpoint gets default-deny in both directions, and policies add
# up. Policy 1 covers every pod in arc-runners (runner and job pods): DNS and
# public addresses on 443. The CIDR pattern is the one from media/trawl; it
# cannot match pods or nodes (Cilium runs without policy-cidr-match-mode).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-base
spec:
  endpointSelector: {}
  ingress:
    # Kubelet only; nothing else may connect in.
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8 # RFC 1918
            - 172.16.0.0/12 # RFC 1918
            - 192.168.0.0/16 # RFC 1918: the LAN and VLAN 10
            - 100.64.0.0/10 # CGNAT: Tailscale
            - 169.254.0.0/16 # link-local
            - 192.0.0.0/24 # IETF protocol assignments
            - 198.18.0.0/15 # benchmarking
            - 224.0.0.0/3 # multicast and reserved
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Policy 2: runner pods only. ARC 0.15.1 labels every runner pod
# actions-ephemeral-runner=True (newEphemeralRunnerPod); the hook's job pods
# do not carry it. The hook creates job pods through the API server; job pods
# never reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runner-pod-apiserver
spec:
  endpointSelector:
    matchLabels:
      actions-ephemeral-runner: "True"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
