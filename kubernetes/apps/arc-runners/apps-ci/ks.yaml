---
# SOPS decryption for this Kustomization comes from the cluster-apps patch
# (kubernetes/flux/cluster/ks.yaml), as for every child Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-ci
spec:
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  interval: 1h
  path: ./kubernetes/apps/arc-runners/apps-ci/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: arc-runners
  wait: true
