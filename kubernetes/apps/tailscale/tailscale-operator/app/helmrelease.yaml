---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  # spec.chart (not chartRef) so Renovate's flux manager tracks the version.
  # Images default to the chart appVersion, so they move with the chart.
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
  interval: 1h
  # The chart ships its CRDs as templates (installCRDs), so a plain uninstall
  # would delete them and every tailscale.com object with them. `keep` makes
  # Helm leave the CRDs behind on uninstall; delete them by hand after review.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: .*\.tailscale\.com
            patch: |-
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: _
                annotations:
                  helm.sh/resource-policy: keep
  values:
    installCRDs: true
    # Credentials come from the SOPS Secret tailscale-operator-oauth (keys
    # client_id and client_secret). oauth.clientId stays empty, so the chart
    # renders no Secret of its own. The operator pod cannot start until that
    # Secret exists.
    oauthSecretVolume:
      secret:
        secretName: tailscale-operator-oauth
    operatorConfig:
      hostname: tailscale-operator
      defaultTags:
        - tag:k8s-operator
      image:
        repository: ghcr.io/tailscale/k8s-operator
        pullPolicy: IfNotPresent
      logging: info
      extraEnv:
        # tsnet keeps its state under os.UserConfigDir(); as a non-root user
        # with no writable home that fails, so point it at /tmp.
        - name: XDG_CONFIG_HOME
          value: /tmp
        - name: TS_DISABLE_PORTMAPPER
          value: "true"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    ingressClass:
      enabled: true
      name: tailscale
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
      defaultTags: tag:k8s
      # No defaultProxyClass on purpose: a proxy without an explicit hardened
      # ProxyClass has no securityContext and the restricted namespace rejects
      # it, so every new exposure has to choose its ProxyClass deliberately.
    apiServerProxyConfig:
      # Keep the Kubernetes API server off the tailnet.
      mode: "false"
      allowImpersonation: "false"
