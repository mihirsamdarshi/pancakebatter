---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-webhook
resources:
  - ./cloudflared-deployment.yaml
  - ./networkpolicy.yaml
  # The tunnel token (TUNNEL_TOKEN) of the locally managed tunnel flux-webhook.
  - ./cloudflared-token.sops.yaml  # cloudflared-token (key token)
configMapGenerator:
  # The hash suffix rolls cloudflared when its routing changes.
  - name: cloudflared-config
    files:
      - config.yaml=./resources/cloudflared.yaml
