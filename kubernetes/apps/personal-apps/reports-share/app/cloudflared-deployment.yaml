---
# Locally managed tunnel reports-share: the credentials come from the
# reports-share-tunnel Secret (a file, not an environment variable), and the
# routing (only share.<zone> to http://reports-share.reports:3001, everything
# else 404, Cloudflare Access required) comes from resources/cloudflared.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # cloudflare/cloudflared 2026.10.7 (released 2026-10-30; multi-arch index
          # digest from Docker Hub, same as the flux-webhook and eBay tunnels). This is
          # an exception to the 14-day release-age rule, approved by the owner for
          # this security release.
          image: docker.io/cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --config
            - /etc/cloudflared/config.yaml
            - run
          ports:
            # Probe only: no Service, no route, no scrape.
            - name: metrics
              containerPort: 2000
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: reports-share-tunnel
            items:
              - key: credentials.json
                path: credentials.json
