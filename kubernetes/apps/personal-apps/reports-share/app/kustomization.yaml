---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reports-share
resources:
  - ./cloudflared-deployment.yaml
  - ./networkpolicy.yaml
  # The tunnel credentials (credentials.json) of the locally managed tunnel
  # reports-share. The owner writes this file from 1Password with the command
  # in "Guest sharing (the share part)" in kubernetes/apps/personal-apps/README.md;
  # until then it holds a placeholder that cloudflared rejects.
  - ./tunnel-credentials.sops.yaml  # reports-share-tunnel (key credentials.json)
configMapGenerator:
  # The hash suffix is computed before Flux fills in the SECRET_SHARE_* values, so
  # it rolls cloudflared only when this file's text changes, not when a key does:
  # after changing a key, restart it (see the README).
  - name: cloudflared-config
    files:
      - config.yaml=./resources/cloudflared.yaml
