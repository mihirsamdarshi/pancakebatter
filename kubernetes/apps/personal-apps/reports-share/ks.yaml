---
# The Cloudflare Tunnel that carries the read-only guest view of the reports app
# (share.<zone>, the `share` part of the reports entry) to the app's guest port.
# Outside the credential-free app platform, in its own Namespace reports-share,
# because it holds the tunnel credentials. The name must stay <app>-share: the
# share part's network policy admits cloudflared from that namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reports-share-tunnel
  namespace: flux-system
spec:
  # The CiliumNetworkPolicy needs the Cilium CRDs.
  dependsOn:
    - name: cilium
      namespace: kube-system
  decryption:
    provider: sops
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/personal-apps/reports-share/app
  # The tunnel id, the Access team name and the Access application's aud tag
  # (SECRET_SHARE_TUNNEL_ID, SECRET_SHARE_ACCESS_TEAM, SECRET_SHARE_ACCESS_AUD)
  # and the zone (SECRET_DOMAIN) fill resources/cloudflared.yaml.
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: reports-share
  timeout: 3m
  wait: true
