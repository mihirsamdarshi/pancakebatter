---
# One replica with Recreate: the write lock and the hourly write count live in
# the process, so two pods at once would each allow their own writes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: share-admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: share-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: share-admin
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        # A copy of flux-system/ghcr-apps-read made by apps-pull (this namespace
        # is one of its `inputs`).
        - name: apps-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: share-admin
          # Published by the Reports share-admin workflow from main (#855,
          # 7971dea, run 42424567126). To update, pin the digest of a newer
          # sha-<commit> tag; see "share-admin" in ../../README.md.
          image: ghcr.io/mihirsamdarshi/pancakebatter/reports-share-admin@sha256:5aaf00ad7cef4e1889ff3bcbbcea718381008bc414ddc8006ef51205c2b9fda9
          env:
            - name: PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "8081"
            # The exact Host the reports app sends (the Service's cluster DNS
            # name and port). Any other Host gets 404.
            - name: ALLOWED_HOSTS
              value: share-admin.share-admin.svc.cluster.local:8080
            # IDs from cluster-secrets (Flux substitution), not credentials.
            - name: CLOUDFLARE_ACCOUNT_ID
              value: ${SECRET_SHARE_ACCESS_ACCOUNT_ID}
            - name: ACCESS_POLICY_ID
              value: ${SECRET_SHARE_ACCESS_POLICY_ID}
            - name: ACCESS_APP_ID
              value: ${SECRET_SHARE_ACCESS_APP_ID}
            - name: CLOUDFLARE_TOKEN_FILE
              value: /run/credentials/cloudflare-token
            # RESEND_KEY_FILE stays unset: the notification routes answer 501.
          ports:
            - name: http
              containerPort: 8080
            # Probes only. /healthz is on its own port so a probe never reaches
            # the write routes. The policy denies the node on 8080.
            - name: health
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Listening only: a missing token must not restart the pod during start.
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 12
          # Ready only while the token file is readable and not empty.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          # Process alive and listening. Not /healthz: a missing token is not
          # fixed by a restart, and a restart loop would hide the real cause.
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The whole directory, not a subPath, so a rotated Secret reaches the
            # file without a restart. The service reads the token on every
            # request.
            - name: credentials
              mountPath: /run/credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: credentials
          secret:
            secretName: share-admin-credentials
            defaultMode: 288 # 0440
            items:
              - key: cloudflare-token
                path: cloudflare-token
