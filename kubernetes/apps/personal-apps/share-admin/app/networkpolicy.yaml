---
# Default deny in both directions for every pod in the namespace.
#
# Ingress:
# - 8080/TCP (the write routes) only from the reports app pod: label
#   app.kubernetes.io/name=reports in the namespace reports, which the platform's
#   base Deployment sets. Not the reports job pod (label reports-job), the
#   VolSync mover or any other pod of that namespace.
# - 8081/TCP (/healthz only) from the node, for kubelet probes. It serves no
#   write route, so any host process reaching it is accepted.
# - The node is denied on 8080 (ingressDeny below). Cilium in Kubernetes mode
#   always allows traffic from the local host to the pods on it (allow-localhost),
#   on every port, whatever the ingress rules say, so without the deny the
#   kubelet, host-network pods (Alloy, node-exporter, the Cilium agent) and any
#   host process on this node could reach the write routes. A deny rule wins over
#   every allow, including that built-in one.
#
# Egress: cluster DNS, and 443/TCP to Cloudflare's published IPv4 ranges only
# (the Cloudflare API is served from them). The same list as the cloudflared
# policy in ../../reports-share/app/networkpolicy.yaml. The service's code also
# sends requests only to the fixed https://api.cloudflare.com base URL in
# src/index.ts, with redirects refused. If Cloudflare changes its ranges, the
# service fails closed (timeouts, 502) until this list is updated.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: share-admin
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: reports
            app.kubernetes.io/name: reports
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  ingressDeny:
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # https://www.cloudflare.com/ips-v4, checked 2026-11-06 (as in reports-share).
    - toCIDRSet:
        - cidr: 173.245.48.0/20
        - cidr: 103.21.244.0/22
        - cidr: 103.22.200.0/22
        - cidr: 103.31.4.0/22
        - cidr: 141.101.64.0/18
        - cidr: 108.162.192.0/18
        - cidr: 190.93.240.0/20
        - cidr: 188.114.96.0/20
        - cidr: 197.234.240.0/22
        - cidr: 198.41.128.0/17
        - cidr: 162.158.0.0/15
        - cidr: 104.16.0.0/13
        - cidr: 104.24.0.0/14
        - cidr: 172.64.0.0/13
        - cidr: 131.0.72.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
