---
# The Namespace of the platform app scratch: Git-defined, Pod Security
# `restricted`, prune-disabled. Everything inside it comes from the entry
# kubernetes/apps/flux-system/app-platform/apps/scratch.yaml, not from this
# folder. A custom `path` folder would be scratch/app/, never this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scratch
components:
  - ../../../components/personal-namespace
