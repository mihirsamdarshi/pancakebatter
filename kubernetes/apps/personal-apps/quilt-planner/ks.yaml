apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-bootstrap
spec:
  interval: 1h
  path: ./kubernetes/apps/personal-apps/quilt-planner/app
  postBuild:
    substitute:
      APP: quilt-planner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: false
---
# Nightly backup of quilt-data, plus an export of a consistent copy of quilt.db
# just before it (components/volsync and components/sqlite-export). Separate
# from the app, which the platform applies (flux-system/app-quilt-planner).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quilt-planner-backup
spec:
  dependsOn:
    - name: quilt-planner-bootstrap
      namespace: quilt-planner
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/personal-apps/quilt-planner/backup
  postBuild:
    substitute:
      APP: quilt-planner
      VOLSYNC_CLAIM: quilt-data
      VOLSYNC_NAMESPACE: quilt-planner
      VOLSYNC_SCHEDULE: "15 10 * * *"
      # The app runs as 1000: the export and the backup mover run as it too.
      APP_UID: "1000"
      APP_GID: "1000"
      # quilt.db is WAL-mode SQLite. The export runs ten minutes before the
      # backup.
      SQLITE_DBS: quilt.db
      SQLITE_SCHEDULE: "5 10 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: quilt-planner
  wait: false
