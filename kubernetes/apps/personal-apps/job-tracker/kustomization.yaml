---
# The Namespace of the platform app job-tracker: Git-defined, Pod Security
# `restricted`, prune-disabled. Everything inside it comes from the entry
# kubernetes/apps/flux-system/app-platform/apps/job-tracker.yaml, not from this
# folder. A custom `path` folder would be job-tracker/app/, never this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: job-tracker
components:
  - ../../../components/personal-namespace
