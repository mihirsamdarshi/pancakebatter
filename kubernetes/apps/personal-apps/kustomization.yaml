---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./quilt-planner
  - ./hello
  - ./deal-watch
  # The Deal Watch worker keeps its Flux Kustomization in flux-system and its own
  # Namespace deal-watch-integrations. It is listed on its own so the
  # `namespace: deal-watch` in deal-watch/kustomization.yaml does not apply to it.
  - ./deal-watch/integrations
  - ./scratch
  - ./reports
  # The Claude API proxy keeps its Flux Kustomization in flux-system and its own
  # Namespace claude-proxy. Platform apps reach it with `egress: claude-proxy`.
  - ./claude-proxy
  - ./homepage
  # The Homepage Flux Kustomizations keep their identity in the `home` Flux
  # namespace (explicit metadata.namespace); they deploy into `homepage`.
  - ./homepage/ks.yaml
  - ./homepage-family/ks.yaml
