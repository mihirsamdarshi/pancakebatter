---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./quilt-planner
  - ./hello
  - ./deal-watch
  # The Deal Watch worker keeps its Flux Kustomization in flux-system and its own
  # Namespace deal-watch-integrations. It is listed on its own so the
  # `namespace: deal-watch` in deal-watch/kustomization.yaml does not apply to it.
  - ./deal-watch/integrations
  # The eBay receiver and its Cloudflare Tunnel: Flux Kustomization in flux-system,
  # own Namespace deal-watch-ebay.
  - ./deal-watch/ebay-receiver
  - ./scratch
  - ./reports
  # The Cloudflare Tunnel behind the reports entry's `share` part: Flux
  # Kustomization in flux-system, own Namespace reports-share.
  - ./reports-share
  - ./job-tracker
  - ./fantasy
  # The Claude API proxy keeps its Flux Kustomization in flux-system and its own
  # Namespace claude-proxy. Platform apps reach it with `egress: claude-proxy`.
  - ./claude-proxy
  # The share-admin service keeps its Flux Kustomization in flux-system and its own
  # Namespace share-admin. The reports app reaches it with the `share-admin` part.
  - ./share-admin
  - ./homepage
  # The Homepage Flux Kustomizations keep their identity in the `home` Flux
  # namespace (explicit metadata.namespace); they deploy into `homepage`.
  - ./homepage/ks.yaml
  - ./homepage-family/ks.yaml
