---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deal-watch-ebay
resources:
  - ./pvc.yaml
  - ./receiver-deployment.yaml
  - ./receiver-service.yaml
  - ./cloudflared-deployment.yaml
  - ./networkpolicy.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
  # The five Secrets come from the stage E secret script (SOPS, from 1Password
  # and cluster-secrets).
  - ./registry.sops.yaml           # deal-watch-ebay-registry (GHCR pull)
  - ./notify-token.sops.yaml       # ebay-notify-token
  - ./app-credentials.sops.yaml    # ebay-app-credentials
  - ./cloudflared-token.sops.yaml  # cloudflared-token
  - ./endpoint.sops.yaml           # ebay-receiver-endpoint (key url)
configMapGenerator:
  # The hash suffix rolls cloudflared when its routing changes.
  - name: cloudflared-config
    files:
      - config.yaml=./resources/cloudflared.yaml
