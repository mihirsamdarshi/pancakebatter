---
# Deal Watch worker: outside the credential-free app platform, next to the
# dashboard entry in personal-apps/deal-watch/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deal-watch-integrations
  namespace: flux-system
spec:
  dependsOn:
    # app-deal-watch is generated from live registry inputs. Keep the Git DAG
    # statically renderable; the worker gates every cycle on the app/policy.
    # No gateway: the worker calls the app's Service directly.
    - name: app-platform
      namespace: flux-system
  decryption:
    provider: sops
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/personal-apps/deal-watch/integrations/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: deal-watch-integrations
  timeout: 3m
  wait: true
