---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deal-watch-integrations
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: deal-watch-integrations
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: deal-watch-integrations
            app.kubernetes.io/name: deal-watch-browser
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: deal-watch-ebay
            app.kubernetes.io/name: ebay-receiver
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The Deal Watch app pod, directly (its Service port 80 is the pod's 3000).
    # Never the Envoy gateways: through them this pod could ask for any
    # internal host name. scripts/validate-apps.sh checks this whole policy
    # (the deal-watch entry's `integrations` part).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: deal-watch
            app.kubernetes.io/name: deal-watch
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
