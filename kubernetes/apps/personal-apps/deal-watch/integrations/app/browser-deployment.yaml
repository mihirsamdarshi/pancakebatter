---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-watch-browser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deal-watch-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deal-watch-browser
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: apps-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser
          image: ghcr.io/mihirsamdarshi/pancakebatter/deal-watch-browser@sha256:de187829e65596710befff5c3d3be05c88bd2fda1cf7d84a1bc33a517d00f112
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          # /healthz is 503 when Chromium or Xvfb is gone, or an observation is stuck over 130 s.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/pwuser
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
