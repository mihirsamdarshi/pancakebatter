---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-watch-integrations
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deal-watch-integrations
  template:
    metadata:
      annotations:
        checksum/runtime-config: dde4f89d11bde31bd30b834eb9f897151d6a01bd6f331bfb314268bc94f5a324
      labels:
        app.kubernetes.io/name: deal-watch-integrations
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: deal-watch-integrations-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/mihirsamdarshi/pancakebatter/deal-watch-integrations@sha256:3770e5892c3f9920ab6449bdae8e4bb80dbe2a6f7cc17b5ee255aa86259ef5f5
          env:
            - name: APP_BASE_URL
              value: https://deal-watch.${SECRET_DOMAIN_LOCAL}
            - name: WATCH_CONFIG_FILE
              value: /run/credentials/watch-policy.json
            - name: DISCORD_WEBHOOK_FILE
              value: /run/credentials/discord-webhook
          ports:
            - name: health
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Process startup is independent of upstream app/policy readiness.
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          # No liveness restart loop for an upstream outage; readiness is the signal.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /run/credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: credentials
          secret:
            secretName: deal-watch-integrations-credentials
            defaultMode: 288 # 0440
