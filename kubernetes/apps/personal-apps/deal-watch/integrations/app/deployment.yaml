---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-watch-integrations
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deal-watch-integrations
  template:
    metadata:
      annotations:
        checksum/runtime-config: d1b73b580c0ed1b77a80d49d75102b30d77e012b809bd0dd3b6c2f2db54bb271
      labels:
        app.kubernetes.io/name: deal-watch-integrations
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: deal-watch-integrations-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/mihirsamdarshi/pancakebatter/deal-watch-integrations@sha256:16c11227808015feb7c022b495b1154aeadd5a671eadac9d7cc6262631eac982
          env:
            - name: APP_BASE_URL
              value: https://deal-watch.${SECRET_DOMAIN_LOCAL}
            - name: WATCH_CONFIG_FILE
              value: /run/credentials/watch-policy.json
            - name: DISCORD_WEBHOOK_FILE
              value: /run/credentials/discord-webhook
            - name: BROWSER_URL
              value: http://deal-watch-browser.deal-watch-integrations.svc.cluster.local:3000
          ports:
            - name: health
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Process startup is independent of upstream app/policy readiness.
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          # No liveness restart loop for an upstream outage; readiness is the signal.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /run/credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: credentials
          secret:
            secretName: deal-watch-integrations-credentials
            defaultMode: 288 # 0440
