---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-watch-integrations
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deal-watch-integrations
  template:
    metadata:
      annotations:
        checksum/runtime-config: 6f6fa77b7d8bb4e280a909aaab7a8be988d60554f65751c30b2ed0ff8141a8cd
      labels:
        app.kubernetes.io/name: deal-watch-integrations
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: deal-watch-integrations-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/mihirsamdarshi/pancakebatter/deal-watch-integrations@sha256:f44f7adf78fd92280db3b1be7ca52ff63d504ac05a42619848ee1ec1db771534
          env:
            - name: APP_BASE_URL
              value: https://deal-watch.${SECRET_DOMAIN_LOCAL}
            - name: WATCH_CONFIG_FILE
              value: /run/credentials/watch-policy.json
            - name: DISCORD_WEBHOOK_FILE
              value: /run/credentials/discord-webhook
            # Origin only; the worker appends /state. Absent or unreachable means BLOCKED.
            - name: EBAY_STATE_URL
              value: http://ebay-receiver-internal.deal-watch-ebay.svc.cluster.local:3001
            - name: BROWSER_URL
              value: http://deal-watch-browser.deal-watch-integrations.svc.cluster.local:3000
          ports:
            - name: health
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Process startup is independent of upstream app/policy readiness.
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          # No liveness restart loop for an upstream outage; readiness is the signal.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /run/credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: credentials
          secret:
            secretName: deal-watch-integrations-credentials
            defaultMode: 288 # 0440
