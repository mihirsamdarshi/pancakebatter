---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  # Keeps the Flux object where it has always been; only the workloads move.
  namespace: home
spec:
  interval: 1h
  path: ./kubernetes/apps/personal-apps/homepage/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: homepage
  wait: false
