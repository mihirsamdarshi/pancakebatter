---
# Default deny in both directions for every pod in the namespace.
#
# Ingress: port 3000 from the reports app pods only (the platform app that runs
# the agent: label app.kubernetes.io/name=reports, which the platform's base
# Deployment sets, in the reports namespace) and from the node (kubelet
# probes). Other pods of that namespace, such as its scheduled job and the
# VolSync mover, are not admitted. The reports app reaches this Service through
# the platform's `egress: claude-proxy` mode.
#
# Egress: cluster DNS, and port 443 on Anthropic's published inbound IPv4
# ranges only (the cluster is IPv4-only):
#   https://platform.claude.com/docs/en/api/ip-addresses
# (checked 2026-11-03: 160.79.104.0/23 and 153.61.224.0/22; the page says the
# addresses will not change without notice). The cluster uses no toFQDNs rules;
# the proxy's code also sends requests only to the fixed
# https://api.anthropic.com upstream in src/index.ts, with redirects disabled.
# If Anthropic's ranges change, the proxy fails closed: the dropped
# connection times out and requests get a 502 until these ranges are updated.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-proxy
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: reports
            app.kubernetes.io/name: reports
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 160.79.104.0/23
        - 153.61.224.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
