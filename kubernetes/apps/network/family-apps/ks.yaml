---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: family-apps
spec:
  dependsOn:
    - name: tailscale-operator-config
      namespace: tailscale
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/network/family-apps/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
