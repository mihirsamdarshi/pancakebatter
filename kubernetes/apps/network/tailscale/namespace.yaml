---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Shared ingress ProxyGroups use the operator's supported kernel-network
    # proxies, whose init and main containers require privileged access.
    # The operator keeps its own non-root securityContext in the HelmRelease.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
