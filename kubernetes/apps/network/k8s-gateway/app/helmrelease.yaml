---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.10.53"
      externalTrafficPolicy: Cluster
    # Restricted Pod Security profile (the network namespace enforces it). The
    # image has no USER, so the uid is set here; binding port 53 as non-root
    # works because the pod sandbox sets net.ipv4.ip_unprivileged_port_start=0
    # (verified with a throwaway pod on October 28, 2026). NET_BIND_SERVICE is
    # the one capability restricted allows, kept for runtimes without that
    # sysctl.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN_LOCAL}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources Service HTTPRoute
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
