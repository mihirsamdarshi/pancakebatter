---
# Previous family names (*.family.local.<zone>), kept while clients move to
# *.family.<zone>. Rendered only in this cluster, not in template/: for a domain
# without a local. prefix this name equals the new one. Its own Certificate and
# Secret keep the two envoy-family listeners from overlapping in TLS config.
# Remove it with the https-legacy listener and the legacy DNS record.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: family-legacy-production
spec:
  dnsNames:
    - "*.family.${SECRET_DOMAIN_LOCAL}"
  duration: 2160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: family-legacy-production-tls
  usages:
    - digital signature
