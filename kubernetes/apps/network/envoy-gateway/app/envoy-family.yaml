---
# Family tailnets reach the cluster only through the standalone family-apps
# Tailscale node, which forwards straight to this Gateway's proxy pods. A
# separate Gateway that serves nothing but family hostnames keeps every
# internal-only route (all attached to envoy-internal) off those tailnets.
# Routes attach with the parentRef name only (no sectionName): each hostname
# then lands on the one listener that matches it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-family
spec:
  # Inherit replicas, resources, shutdown and telemetry from the GatewayClass
  # EnvoyProxy. Its externalTrafficPolicy is ignored for a ClusterIP Service.
  mergeType: StrategicMerge
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # The Tailscale Service selects these pods directly, so no LAN
        # LoadBalancer IP is needed or wanted.
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-family
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-family
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_FAMILY_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: family-production-tls
    # Previous family names (*.family.local.<zone>), kept while clients move to
    # *.family.<zone>. Remove this listener, its Certificate and the legacy DNS
    # record together. It has its own Secret: two listeners sharing one Secret
    # overlap in TLS config, and with h2 on browsers could reuse a connection
    # across the old and new names and get a 404.
    - name: https-legacy
      protocol: HTTPS
      port: 443
      hostname: "*.family.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: family-legacy-production-tls
    # The bare family name (family.<zone>), which the wildcard listener above
    # does not cover. Its own Certificate and Secret keep the SANs of the two
    # listeners disjoint: Envoy Gateway flags overlapping SANs, and with h2 a
    # browser could reuse one connection across both names and get a 404.
    - name: https-landing
      protocol: HTTPS
      port: 443
      hostname: "${SECRET_FAMILY_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: family-landing-production-tls
