---
# The TrueNAS and Proxmox (Hobbes) web UIs on envoy-internal, as
# truenas.${SECRET_DOMAIN_LOCAL} and hobbes.${SECRET_DOMAIN_LOCAL}. The
# backends are fixed lab addresses outside the cluster and the pinned backend
# certificates are this lab's, so this app is specific to this cluster and not
# part of template/ (only its line in network/kustomization.yaml is mirrored).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-uis
spec:
  dependsOn:
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/network/lab-uis/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
