---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One file per UI, plus one per pinned backend certificate. The BackendTLSPolicy
# objects name the CA ConfigMaps directly, so they are plain ConfigMaps, not
# generated ones (a generator's hash suffix would break that reference).
resources:
  - ./hobbes.yaml
  - ./hobbes-ca.yaml
