# HAProxy as a plain TCP relay in front of the TrueNAS UI (see
# truenas-relay.yaml for why it exists). It never terminates TLS: Envoy's TLS
# session (SNI localhost, the pinned certificate) passes through to TrueNAS
# byte for byte, so the relay never sees a password or a token.

global
    log stdout format raw local0 info
    # Set explicitly: otherwise HAProxy sizes its tables from the container's
    # file limit, which can be about a million, and that costs memory.
    maxconn 1000
    nbthread 1
    # The image stops HAProxy with SIGUSR1 (soft stop: wait for every
    # connection to end). Websockets can stay open for days, so close what is
    # left after 5 s; a Recreate rollout then waits seconds, not the full grace
    # period.
    hard-stop-after 5s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # One retry (the default is 3), so requests fail fast when TrueNAS is down.
    retries 1
    # Idle limits. TrueNAS's nginx keeps an idle Shell open for 7 days
    # (location /websocket/shell: proxy_read_timeout 7d), so the relay must not
    # cut it sooner. The UI websocket (/websocket, /api) has nginx's 60 s limit
    # and the UI keeps it busy. Idle pooled HTTP connections are closed by
    # Envoy (60 s on writes) or by nginx (keepalive_timeout 65 s), and the
    # relay passes that close on.
    timeout client 7d
    timeout server 7d
    timeout client-fin 30s
    timeout server-fin 30s
    # TCP keepalives on both sides. The kernel default waits 2 h before the
    # first probe, and Cilium forgets an idle connection's NAT entry after
    # 2 h 13 min. So probe after 10 min idle, every 30 s, and give up after 4:
    # an idle Shell keeps its NAT entry, and a peer that vanished (a crashed
    # Envoy pod) frees its slot after about 12 min.
    option clitcpka
    option srvtcpka
    clitcpka-idle 10m
    clitcpka-intvl 30s
    clitcpka-cnt 4
    srvtcpka-idle 10m
    srvtcpka-intvl 30s
    srvtcpka-cnt 4

frontend relay
    bind :8443
    default_backend truenas

backend truenas
    # The TrueNAS UI on its VLAN 10 leg. If the UI is ever bound to
    # 192.168.1.75 only (an optional storage-leg follow-up), this stops working.
    server truenas 192.168.10.75:443

# Probes go here, not to :8443: in tcp mode every connection to :8443 opens a
# connection to TrueNAS. The kubelet's TCP probes send no data, so
# dontlognull keeps them out of the log.
frontend health
    mode http
    bind :8404
    option httplog
    monitor-uri /healthz
    timeout client 5s
    timeout http-request 5s
