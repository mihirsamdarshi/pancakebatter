---
# truenas.${SECRET_DOMAIN_LOCAL}: the TrueNAS web UI over HTTPS on its VLAN 10
# storage leg, with the backend certificate verified (truenas-ca.yaml).
#
# Why 192.168.10.75 and not 192.168.1.75: Envoy's connections leave from a
# node on VLAN 10 (Cilium masquerades pod traffic to the node address).
# TrueNAS also has a leg on VLAN 10, so its reply to a request sent to
# 192.168.1.75 would leave straight out of that leg and skip the router that
# carried the request: an asymmetric path through a stateful firewall.
# 192.168.10.75 keeps both directions on one segment.
#
# Known limit (open design question): TrueNAS 25.10 ties its login tokens to
# the client IP it sees. Through this route that is the address of the node
# whose envoy-internal pod carried the connection, and a browser's connections
# can land on either pod. Reload, new tab, websocket reconnect, Shell, uploads
# and downloads then fail about half the time. Use https://192.168.1.75 until
# that is settled.
#
# Who can reach it: everyone who can reach envoy-internal could already reach
# the TrueNAS UI directly, except deal-watch-integrations. Until the
# deal-watch-integrations follow-up merges, that workload can reach this login
# page through envoy-internal; the follow-up removes that path.
apiVersion: v1
kind: Service
metadata:
  name: truenas
spec:
  # No selector: the EndpointSlice below names the backend.
  ports:
    - name: https
      protocol: TCP
      # Forces HTTP/1.1 to this backend. With a BackendTLSPolicy, Envoy Gateway
      # otherwise uses ALPN auto mode (h2,http/1.1); TrueNAS's nginx picks h2,
      # and WebSocket upgrades over h2 fail (envoyproxy/gateway#9121).
      appProtocol: kubernetes.io/wss
      port: 443
      targetPort: 443
---
# The port name and protocol must match the Service port: Envoy Gateway skips
# an EndpointSlice port that differs in either.
#
# This route needs the TrueNAS UI to keep listening on 192.168.10.75. The
# storage-leg runbook in the owner's notes lists an optional follow-up: narrow
# the NFS allowlists to the node addresses .21-.23 and bind the UI and SMB to
# 192.168.1.75. If the UI is bound to 192.168.1.75, this route stops working
# (Envoy can no longer connect). Change this route before doing that.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  labels:
    kubernetes.io/service-name: truenas
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - 192.168.10.75
    conditions:
      ready: true
---
# Envoy connects with TLS, sends SNI `localhost` and accepts only a certificate
# that chains to the pinned one in truenas-ca.yaml and has the DNS SAN
# `localhost` (the TrueNAS self-signed UI certificate has no other name).
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: truenas
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: truenas
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: truenas-ui-ca
    hostname: localhost
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - truenas.${SECRET_DOMAIN_LOCAL}
  rules:
    # Two named rules so the BackendTrafficPolicy below can switch retries off
    # for writes only. GET and HEAD (which include the UI's /websocket and
    # /api/current upgrades) are more specific than the catch-all, so they
    # always land on `reads`.
    - name: reads
      matches:
        - method: GET
        - method: HEAD
      backendRefs:
        - name: truenas
          port: 443
    - name: writes
      backendRefs:
        - name: truenas
          port: 443
---
# The gateway-wide policy (network/envoy-gateway) retries a request twice when
# the upstream connection resets. A TrueNAS write (a file sent to /_upload, a
# REST call) may already have been applied when that happens, so the `writes`
# rule gets no retries. mergeType keeps everything else from the gateway-wide
# policy (compression, keepalive, requestTimeout 0s) instead of replacing it.
# Same pattern as personal-apps/quilt-planner/internal.
#
# With no retries, a write must not land on a connection nginx is closing.
# TrueNAS's nginx closes an idle connection after 65 s (keepalive_timeout), so
# Envoy drops its own at 60 s, first. This reaches only this rule's cluster.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: truenas-writes
spec:
  mergeType: StrategicMerge
  retry:
    numRetries: 0
  timeout:
    http:
      connectionIdleTimeout: 60s
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: truenas
      sectionName: writes
