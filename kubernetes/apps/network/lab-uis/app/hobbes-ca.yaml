---
# The pinned trust anchor for the hobbes BackendTLSPolicy (hobbes.yaml): the
# Proxmox cluster CA. Public certificate only.
#
# pveproxy on Hobbes serves its node certificate /etc/pve/local/pve-ssl.pem
# (no custom pveproxy-ssl.pem is installed), which this CA signs and which has
# the SAN DNS:hobbes, so the policy's hostname is `hobbes`. A renewed node
# certificate is signed by the same CA, so renewals need no change here.
#   CA: CN=Proxmox Virtual Environment, O=PVE Cluster Manager CA
#   SHA-256 fingerprint:
#     18:20:E5:6E:48:06:5D:82:F9:3A:5D:04:AC:85:B8:9C:B9:E1:D0:6D:5D:DC:58:48:13:6A:24:7D:94:3F:24:FF
#   valid until 2033-04-23 03:58 UTC
#
# Where it came from (November 10, 2026):
#   ssh root@192.168.1.62 cat /etc/pve/pve-root-ca.pem
#
# If pveproxy ever serves a certificate this CA did not sign (a custom or ACME
# certificate set under Hobbes > System > Certificates), or the cluster CA is
# replaced, the hobbes route answers 503 (upstream TLS verify error) until the
# new issuer's CA is put here and `hostname` in hobbes.yaml still matches a
# DNS SAN. The direct address https://192.168.1.62:8006 keeps working
# meanwhile.
