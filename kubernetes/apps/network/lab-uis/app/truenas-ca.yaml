---
# The pinned trust anchor for the truenas BackendTLSPolicy (truenas.yaml).
# Public certificate only; never put a private key here.
#
# It is TrueNAS's own self-signed UI certificate `truenas_default`: subject and
# issuer CN=localhost, SAN DNS:localhost only, so the policy's hostname is
# `localhost`. Envoy accepts a certificate from its trusted CA list as a trust
# anchor even when it is not a CA certificate.
#   SHA-256 fingerprint:
#     0F:87:ED:8C:31:BF:A6:A4:60:F2:B9:B3:7B:B7:EF:40:8B:6B:84:7D:21:AE:3E:40:B1:41:E6:8D:15:89:B0:00
#   valid until 2027-11-19 01:05 UTC: replace it before then.
#
# The pin is only as strong as this certificate's private key. The owner's
# open-work list has an item to regenerate the TrueNAS UI certificate; when that
# is done, the route needs the new PEM here.
#
# Where it came from (November 10, 2026; this prints the public PEM only):
#   ssh root@192.168.1.62 "echo | openssl s_client -connect 192.168.1.75:443 -servername localhost 2>/dev/null | openssl x509"
# Never read it through the TrueNAS API calls system.general.config or
# certificate.query without a filter: they also return the private key.
#
# When the TrueNAS UI certificate changes (it is renewed or regenerated, or
# another certificate is chosen for the UI), the truenas route answers 503
# (upstream TLS verify error) until this PEM is replaced with the new one,
# read with the same command. If the new certificate has other names, also set
# `hostname` in truenas.yaml to one of its DNS SANs. The direct address
# https://192.168.1.75 keeps working meanwhile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-ui-ca
data:
  ca.crt: |
