---
# Selecting every pod in arc-systems (the controller and the listeners) turns
# on default-deny in both directions. Policies add up. Nothing else runs in
# this namespace. The internet rule is the CIDR pattern from media/trawl:
# public addresses only, port 443. It cannot match pods or nodes (Cilium runs
# without policy-cidr-match-mode).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-systems
spec:
  endpointSelector: {}
  ingress:
    # Kubelet probes come from the node.
    - fromEntities:
        - host
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The API server (same rule as headlamp).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # GitHub (api.github.com and the Actions service): public addresses only.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8 # RFC 1918
            - 172.16.0.0/12 # RFC 1918
            - 192.168.0.0/16 # RFC 1918: the LAN and VLAN 10
            - 100.64.0.0/10 # CGNAT: Tailscale
            - 169.254.0.0/16 # link-local
            - 192.0.0.0/24 # IETF protocol assignments
            - 198.18.0.0/15 # benchmarking
            - 224.0.0.0/3 # multicast and reserved
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
