---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # The ARC controller and the listener pods. Both run under the restricted
    # profile. No SOPS component here: the namespace holds no cluster-secrets.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
