---
# The LAN dashboard: one tile for every app and admin UI, plus cluster CPU and
# memory. It is for the home network only (envoy-internal), so it may link to
# anything. The family start page is the separate `homepage-family` release.
#
# TODO(widgets): per-service widgets (Jellyfin streams, *arr queues, Grafana
# alerts, TrueNAS pools, Proxmox, UniFi) all need an API key, and keys must not
# land in Git unencrypted. To add one: put it in a SOPS Secret in this
# directory, load it with controllers.homepage.containers.app.envFrom as
# HOMEPAGE_VAR_<NAME>, and use the placeholder {{HOMEPAGE_VAR_<NAME>}} in
# services.yaml. Helm would expand the braces, so write the placeholder as the
# string template {{ "{{HOMEPAGE_VAR_<NAME>}}" }}.
#
# Status dots (siteMonitor) are server-side checks from this pod: any answer
# up to HTTP 403 is green, a timeout or a 5xx is red. Cluster apps are checked
# through their own hostnames, so a red dot can also mean DNS or the Gateway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    defaultPodOptions:
      # Cluster mode reads the in-cluster token.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      homepage: {}
    # Read-only, and only what the cluster widget calls: list nodes and their
    # metrics (metrics-server). Service discovery (gateway, ingress) is off, so
    # no routes, pods or namespaces are readable.
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - nodes
              verbs:
                - get
                - list
            - apiGroups:
                - metrics.k8s.io
              resources:
                - nodes
              verbs:
                - get
                - list
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    controllers:
      homepage:
        # Stateless, so the new pod can start before the old one stops. A
        # config edit changes the chart's configMaps checksum annotation on the
        # pod template, which rolls the pod (subPath mounts never refresh in
        # a running pod); Reloader is not needed.
        strategy: RollingUpdate
        serviceAccount:
          identifier: homepage
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
            env:
              TZ: Etc/UTC
              # Required since v1.0: Homepage rejects API calls whose Host is
              # not listed. The Host header arrives unchanged from the browser.
              HOMEPAGE_ALLOWED_HOSTS: home.${SECRET_DOMAIN}
              # The default also writes /app/config/logs, which the read-only
              # root filesystem does not allow.
              LOG_TARGETS: stdout
              NEXT_TELEMETRY_DISABLED: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    # The kubelet sends the pod IP as Host, which the allowed
                    # hosts check would reject. localhost:3000 is always allowed.
                    httpHeaders:
                      - name: Host
                        value: localhost:3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost:3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost:3000
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 384Mi
    service:
      homepage:
        controller: homepage
        ports:
          http:
            port: *port
    route:
      homepage:
        hostnames:
          - home.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: homepage
                port: *port
    configMaps:
      config:
        data:
          settings.yaml: |
            title: Homelab
            theme: dark
            color: slate
            headerStyle: clean
            useEqualHeights: true
            disableCollapse: true
            hideVersion: true
            disableUpdateCheck: true
            disableIndexing: true
            statusStyle: dot
            target: _blank
            layout:
              Apps:
                style: row
                columns: 4
              Automation:
                style: row
                columns: 4
              Infrastructure:
                style: row
                columns: 5
          services.yaml: |
            - Apps:
                - Jellyfin:
                    icon: jellyfin.png
                    href: https://jellyfin.${SECRET_DOMAIN}
                    siteMonitor: https://jellyfin.${SECRET_DOMAIN}
                    description: Movies and shows
                - Requests:
                    icon: seerr.png
                    href: https://requests.${SECRET_DOMAIN}
                    siteMonitor: https://requests.${SECRET_DOMAIN}
                    description: Seerr
                - Quilts:
                    icon: mdi-needle
                    href: https://quilts.${SECRET_DOMAIN}
                    siteMonitor: https://quilts.${SECRET_DOMAIN}
                    description: Quilt Planner
                - Home Assistant:
                    icon: home-assistant.png
                    href: http://192.168.1.150:8123
                    siteMonitor: http://192.168.1.150:8123
                    description: On the Raspberry Pi
            - Automation:
                - Sonarr:
                    icon: sonarr.png
                    href: https://sonarr.${SECRET_DOMAIN}
                    siteMonitor: https://sonarr.${SECRET_DOMAIN}
                    description: TV
                - Radarr:
                    icon: radarr.png
                    href: https://radarr.${SECRET_DOMAIN}
                    siteMonitor: https://radarr.${SECRET_DOMAIN}
                    description: Movies
                - Prowlarr:
                    icon: prowlarr.png
                    href: https://prowlarr.${SECRET_DOMAIN}
                    siteMonitor: https://prowlarr.${SECRET_DOMAIN}
                    description: Indexers
                - qBittorrent:
                    icon: qbittorrent.png
                    href: https://qbittorrent.${SECRET_DOMAIN}
                    siteMonitor: https://qbittorrent.${SECRET_DOMAIN}
                    description: Downloads over VPN
            - Infrastructure:
                - Grafana:
                    icon: grafana.png
                    href: https://grafana.${SECRET_DOMAIN}
                    siteMonitor: https://grafana.${SECRET_DOMAIN}
                    description: Metrics and logs
                - TrueNAS:
                    icon: truenas.png
                    href: https://192.168.1.75
                    siteMonitor: https://192.168.1.75
                    description: Storage
                - Proxmox:
                    icon: proxmox.png
                    href: https://192.168.1.62:8006
                    siteMonitor: https://192.168.1.62:8006
                    description: Hobbes
                - UniFi:
                    icon: unifi.png
                    href: https://192.168.1.1
                    siteMonitor: https://192.168.1.1
                    description: Network
                - Pi-hole:
                    icon: pi-hole.png
                    href: http://192.168.1.150:32769/admin
                    siteMonitor: http://192.168.1.150:32769/admin
                    description: DNS, still running on the Pi
          widgets.yaml: |
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: cluster
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
            - datetime:
                text_size: xl
                format:
                  dateStyle: medium
                  timeStyle: short
          bookmarks.yaml: ""
          docker.yaml: ""
          proxmox.yaml: ""
          # Cluster mode so the widget can list nodes. Discovery is off: the
          # tiles above are the only source, in one reviewable place.
          kubernetes.yaml: |
            mode: cluster
            ingress: false
            gateway: false
            traefik: false
          custom.css: ""
          custom.js: ""
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/proxmox.yaml
            subPath: proxmox.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
          - path: /app/config/custom.css
            subPath: custom.css
            readOnly: true
          - path: /app/config/custom.js
            subPath: custom.js
            readOnly: true
      # Next.js creates its cache directory on the first /_next/image request
      # and exits when the read-only root filesystem refuses.
      next-cache:
        type: emptyDir
        sizeLimit: 128Mi
        globalMounts:
          - path: /app/.next/cache
