---
# Static PV so the NFS mount options are explicit. The whole Media export is
# mounted at /data (downloads/ and media/ side by side), so Sonarr and Radarr,
# which mount it at the same path, import finished downloads as hardlinks.
# Read-write: qBittorrent writes under /data/downloads only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-data
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  nfs:
    server: 192.168.10.75
    path: /mnt/nasty/Media
  claimRef:
    namespace: downloads
    name: qbittorrent-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: qbittorrent-data
  resources:
    requests:
      storage: 1Ti
