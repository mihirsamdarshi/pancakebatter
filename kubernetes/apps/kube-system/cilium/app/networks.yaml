---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    # Reserved for LoadBalancers: gateways .10-.19, k8s-gateway .53. The rest
    # of the /24 holds the UCG (.1), nodes (.21-.23) and the API VIP (.100).
    - start: "192.168.10.10"
      stop: "192.168.10.19"
    - start: "192.168.10.53"
      stop: "192.168.10.53"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
