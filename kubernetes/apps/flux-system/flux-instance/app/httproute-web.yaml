---
# The Flux Operator's built-in Web UI (flux-operator Service, port name
# http-web, 9080), on the internal gateway only. It is anonymous and read-only
# (Secrets and ConfigMaps are refused), and the chart's NetworkPolicy already
# admits any namespace. A standalone route: the flux-operator HelmRelease is
# also consumed by bootstrap and stays untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
spec:
  hostnames: ["flux.${SECRET_DOMAIN_LOCAL}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
