---
# The Flux Operator's built-in Web UI (flux-operator Service, port name
# http-web, 9080), on the internal gateway only. Visitors get the fixed,
# read-only flux-web-anon identity set in the flux-operator HelmRelease. Never
# publish this route without that identity: with no web config the UI uses the
# operator's own cluster-admin client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
spec:
  hostnames: ["flux.${SECRET_DOMAIN_LOCAL}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
