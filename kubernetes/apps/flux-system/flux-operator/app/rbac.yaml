---
# Identity of the Flux Operator Web UI. The UI authenticates every visitor as
# the fixed user "flux-web-anon" (see the web.config values in
# helmrelease.yaml) and sends each Kubernetes request as that user, so this
# role is the whole of what the UI can read or change. Anyone who can reach the
# Service sees exactly this and nothing more.
#
# Read only, on purpose:
#   - No "secrets" and no "configmaps": the UI renders any object it can "get".
#   - No "pods/log" and none of the custom verbs (reconcile, suspend, resume,
#     restart, delete, download): without them the UI offers no action, and the
#     API refuses the action, log and download routes.
#   - "pods" is "list" only: the workload screens list pods to show their
#     status. "get" would let the UI return a whole Pod, with its env values.
#   - Do not bind flux-web-user (its wildcard includes Secrets) or
#     flux-web-admin to this user.
# The UI lists namespaces and the cached report with the operator's own
# account, then keeps the namespaces where this user may "get" ResourceSets, so
# the first rule must stay cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-web-anonymous
rules:
  - apiGroups:
      - fluxcd.controlplane.io
      - source.toolkit.fluxcd.io
      - source.extensions.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-anonymous
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-anonymous
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: flux-web-anon
