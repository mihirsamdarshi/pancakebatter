---
# quilt-planner: the first app moved onto the platform from its own Git
# Kustomization (move plan D2). Since D9b it runs the apps monorepo image at
# its `main` tag with the copied pull Secret `apps-ghcr`, like every platform
# app. To roll back the image, set `pin: <digest>` here.
#
# parts: the workload (always), the copied pull Secret `apps-ghcr` (D9a) and
# the family route (D5). The internal route and backup stay Git-defined.
# The default network policy has been on since D6b (the tailnet Ingress
# that proxied into the pod is gone).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-quilt-planner
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/quilt-planner
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: quilt-planner
    parts: [pullsecret, family-route, family-route-legacy]
    vars:
      FAMILY_HOST: quilts
      CLAIM: quilt-data
      STORAGE: 5Gi
      STORAGE_CLASS: quilt-local-retain
      HEALTH_PATH: /api/health
      APP_UID: "1000"
      APP_GID: "1000"
