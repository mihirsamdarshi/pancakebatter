---
# scratch: a throwaway shared scratchpad (one text note), built with Railpack
# to exercise the platform. Delete this entry (and its line in
# kustomization.yaml) to stop updating it; the workload keeps running until it
# is removed by hand.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-scratch
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/scratch
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: scratch
    parts: [pullsecret, internal-route, backup, backup-sqlite]
    vars:
      SQLITE_DBS: scratch.db
      VOLSYNC_SCHEDULE: "45 12 * * *"
      SQLITE_SCHEDULE: "35 12 * * *"
