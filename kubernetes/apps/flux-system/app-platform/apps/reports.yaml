---
# reports: research reports with an agent that drafts changes for review. The
# image seeds the reports onto the data volume once; after that the volume (a
# git repository) is the source of truth, so it is backed up. The agent's model
# calls go only to the claude-proxy service (egress: claude-proxy), which holds
# the Anthropic API key outside the platform; this namespace holds no key, and
# the app pod has no internet access. Only the weekly job pod (below) reaches
# one public address, on 443. Family members reach the app through the
# family-apps share at reports.family.<zone>, with the same access as the LAN: reading,
# agent runs (within the proxy's daily cap), publish and undo. The mapkit part
# gives the app its one Secret, a MapKit JS token for the maps in the reports
# (reports-mapkit, from mapkit.sops.yaml in personal-apps/reports/), which the
# owner signs once a year; the private key never enters the cluster. The
# browser loads Apple's map script and tiles; the pod reaches no Apple host.
# The share part opens a second, read-only port (3001) for one guest collection,
# reached at share.<zone> through the Cloudflare Tunnel in personal-apps/reports-share/
# behind Cloudflare Access; the main port stays on the LAN and family routes only.
# Delete this entry (and its line in kustomization.yaml) to stop updating it;
# the workload keeps running until it is removed by hand.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: app-reports
  namespace: flux-system
  labels:
    platform/apps: "true"
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 2m
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/mihirsamdarshi/apps/reports
  secretRef:
    name: ghcr-apps-read
  filter:
    includeTag: "^main$"
    limit: 1
  defaultValues:
    name: reports
    parts: [pullsecret, internal-route, family-route, backup, job, job-egress, mapkit, share]
    egress: claude-proxy
    vars:
      TITLE: Reports
      DESCRIPTION: Research reports and notes
      ICON: mdi-file-document-multiple
      # reports.family.<zone>, for family members through the family-apps share.
      FAMILY_HOST: reports
      # The guest host also appears in reports-share/app/resources/cloudflared.yaml
      # (hostname), terraform/dns/main.tf (the CNAME) and the MapKit token's origin
      # claim (README signer). validate-apps.sh checks the first against this value.
      # share.<zone>, the guest view for one outside person (the share part), and
      # the collection it may read.
      SHARE_HOST: share
      GUEST_COLLECTIONS: fay-ave
      # One agent run at a time; the Agent SDK's hosting guide starts at 1 GiB and 1 CPU per agent.
      # STORAGE stays at the 1Gi default: local-retain cannot expand a bound volume, and the
      # reports plus their git history are tens of MB.
      CPU: 100m
      MEMORY: 512Mi
      MEMORY_LIMIT: 2Gi
      VOLSYNC_SCHEDULE: "0 13 * * *"
      # The weekly job refreshes a collection's County data: LA County's public
      # eGIS parcel layer and the Assessor portal. It reads the live reports read
      # only and writes a batch into the feeds inbox, which the app commits. The
      # app side (the feeds inbox, which the app creates when it starts, and
      # jobs/county-parcels.ts) came with apps PR #27. Sundays at 11:00 UTC,
      # two hours before the backup, with 45 minutes to finish. The job pod
      # cannot reach the app or claude-proxy (job-egress denies both).
      JOB_SCHEDULE: "0 11 * * 0"
      JOB_COMMAND: bun jobs/county-parcels.ts west-la
      JOB_READ_PATH: content
      JOB_WORK_PATH: feeds
      JOB_DEADLINE: "2700"
      # Both County hosts (public.gis.lacounty.gov and portal.assessor.lacounty.gov)
      # resolved to this one Imperva CDN address when checked on Nov 4, 2026
      # from the home network. It is a shared Imperva address, so this rule
      # allows any site Imperva serves there, not only the County's. The
      # cluster uses no toFQDNs rules, so if the address moves, the job fails
      # closed (its connections time out) until this CIDR is updated.
      JOB_EGRESS_CIDR: 45.60.151.78/32
