---
# The image pull Secret of each personal app: a copy of flux-system/ghcr-apps-read
# named apps-ghcr in the app's namespace, for every input whose `parts` contain
# `pullsecret`. A separate ResourceSet from `apps` so that its failures never
# block the app Kustomizations (a ResourceSet applies nothing when one of its
# objects fails the dry run, e.g. a Secret whose namespace does not exist yet).
#
# The copy is prune-disabled: a stale copy is harmless, a missing one during an
# outage is not, so an empty input set or a removed entry never deletes it.
# Never remove fluxcd.controlplane.io/prune: disabled from the template, never
# delete ghcr-apps-read while an entry has `pullsecret`, never rename this
# ResourceSet. Its `parts` default and namespace expression must equal
# resourceset.yaml's. An input without a name renders nothing (see there).
# vars.PULL_SECRET changes only the name the Deployment
# references, never this Secret.
#
# `inputs` lists the namespaces of the apps outside the platform that pull
# private images (claude-proxy, deal-watch-integrations, deal-watch-ebay). They are not
# ResourceSetInputProviders, because a provider would also render an app-*
# Kustomization in `apps`. Flux Operator concatenates `inputs` with the provider
# inputs (docs/api/v1/resourceset.md, "Inputs configuration"). Each namespace
# must exist, or the dry run fails and no copy is applied; they are created by
# their own Kustomization in personal-apps/. A platform app named like one of
# these inputs would render a second Secret for the same namespace and fail the
# dry run; the validator rejects that.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps-pull
  namespace: flux-system
spec:
  inputs:
    - name: claude-proxy
    - name: deal-watch-integrations
    - name: deal-watch-ebay
  dependsOn:
    - apiVersion: v1
      kind: Secret
      name: ghcr-apps-read
      namespace: flux-system
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          platform/apps: "true"
  resourcesTemplate: |
    <<- $parts := list "pullsecret" "internal-route" "backup" >>
    <<- if hasKey inputs "parts" >><<- $parts = inputs.parts >><<- end >>
    <<- if and (get inputs "name") (has "pullsecret" $parts) >>
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: apps-ghcr
      namespace: << get inputs "namespace" | default inputs.name >>
      annotations:
        fluxcd.controlplane.io/copyFrom: flux-system/ghcr-apps-read
        fluxcd.controlplane.io/prune: disabled
    type: kubernetes.io/dockerconfigjson
    <<- end >>
