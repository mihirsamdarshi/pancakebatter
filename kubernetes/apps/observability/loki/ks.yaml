---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
spec:
  dependsOn:
    # Loki keeps its data on a local-path volume; Prometheus supplies the
    # ServiceMonitor and PrometheusRule CRDs.
    - name: local-path-provisioner
      namespace: storage
    - name: kube-prometheus-stack
  interval: 1h
  path: ./kubernetes/apps/observability/loki/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
