---
name: Claude proxy
on:
  pull_request:
    branches: [main]
    paths: [integrations/claude-proxy/**, .github/workflows/claude-proxy.yaml]
  push:
    branches: [main]
    paths: [integrations/claude-proxy/**, .github/workflows/claude-proxy.yaml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked main revision to GHCR
        type: boolean
        default: false
permissions: {}
concurrency:
  group: claude-proxy-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: integrations/claude-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Build amd64 image
        run: docker build --platform linux/amd64 -t claude-proxy:test .
      - name: Non-root, read-only, offline smoke test
        run: bash scripts/smoke-proxy.sh claude-proxy:test
  publish:
    name: Publish proxy
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # publish only the checked proxy image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish fixed revision; deployments pin the resulting digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: integrations/claude-proxy
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/claude-proxy:sha-${{ github.sha }}
