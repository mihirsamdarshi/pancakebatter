---
name: Deal Watch integrations
on:
  pull_request:
    branches: [main]
    paths: [integrations/deal-watch/**, .github/workflows/deal-watch-integrations.yaml]
  push:
    branches: [main]
    paths: [integrations/deal-watch/**, .github/workflows/deal-watch-integrations.yaml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked main revision to GHCR
        type: boolean
        default: false
permissions: {}
concurrency:
  group: deal-watch-integrations-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: integrations/deal-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Build amd64 image
        run: docker build --platform linux/amd64 -t deal-watch-integrations:test .
      - name: Non-root, read-only, offline smoke test
        run: bash scripts/smoke-worker.sh deal-watch-integrations:test
      - name: Browser service tests
        working-directory: integrations/deal-watch/browser
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build amd64 browser image
        run: docker build --platform linux/amd64 -t deal-watch-browser:test browser
      - name: Browser non-root, read-only, offline smoke test
        run: bash scripts/smoke-browser.sh deal-watch-browser:test
      - name: Build amd64 eBay receiver image
        run: docker build --platform linux/amd64 -t deal-watch-ebay-receiver:test ebay-receiver
      - name: eBay receiver non-root, read-only, offline smoke test
        run: bash scripts/smoke-ebay-receiver.sh deal-watch-ebay-receiver:test
  publish:
    name: Publish worker
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # publish only the checked worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish fixed revision; deployments pin the resulting digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: integrations/deal-watch
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/deal-watch-integrations:sha-${{ github.sha }}
      - name: Publish browser image; deployments pin the resulting digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: integrations/deal-watch/browser
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/deal-watch-browser:sha-${{ github.sha }}
      - name: Publish eBay receiver image; deployments pin the resulting digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: integrations/deal-watch/ebay-receiver
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/deal-watch-ebay-receiver:sha-${{ github.sha }}
