---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kubernetes"

# Runs scripts/validate-kubernetes.sh. Flux reconciles main right away, so on
# push to main this is an after-the-fact signal; run `just template configure`
# (or the script) locally before pushing kubernetes/ changes.
#
# No `paths` filter on the triggers: the ruleset on main requires the
# "Kubernetes - Success" check, and a required check can only be satisfied
# when the workflow reports on every pull request. The filter job decides
# whether the validation itself has to run; when nothing relevant changed it
# is skipped and the gate still passes.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Every push to main gets its own run; only superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  filter:
    name: Kubernetes - Filter
    runs-on: ubuntu-latest
    permissions:
      contents: read # compare commits
      pull-requests: read # list the pull request's files
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        # Self-repository form: resolved from this workflow's own commit, so no
        # checkout, and GitHub counts it as pinned.
        uses: $/.github/actions/changed-files
        with:
          patterns: |-
            kubernetes/**/*
            scripts/validate-kubernetes.sh
            scripts/validate-apps.sh
            scripts/validate-apps/**/*
            .github/workflows/kubernetes.yaml
            .github/actions/changed-files/*
            .mise/config.toml
            .mise/mise.lock

  validate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch too: validate-apps.sh compares the entries with it.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: --locked kubeconform kustomize flux2 flux-operator gitleaks jq yq
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Validate manifests
        # APPS_BASE_REF turns on the check that an existing app platform entry
        # keeps its name and namespace (a rename starts a new, empty app).
        env:
          APPS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/validate-kubernetes.sh

      - name: Validate app platform fixtures
        # The validator's own tests: the samples under scripts/validate-apps
        # must pass or be rejected for the stated reason.
        run: bash scripts/validate-apps.sh --self-test

  # The required status check. always(): a cancelled run must not leave the
  # gate skipped, which GitHub would count as passing. It fails when the
  # filter or the validation failed or was cancelled and passes when
  # the validation was skipped.
  success:
    if: ${{ always() }}
    needs: [filter, validate]
    name: Kubernetes - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped"
