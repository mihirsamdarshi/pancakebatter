---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          # A deleted manifest is a change too.
          include_deleted_files: "true"
          patterns: |-
            kubernetes/**/*
            .github/workflows/flate.yaml

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      - name: Run Flate
        id: flate
        # CI cannot decrypt SOPS auth values for private app artifacts. Skip
        # unavailable auth/values refs; the separate Kubernetes gate still
        # validates manifest schemas and exact OCI source references.
        run: flate test all -p ./kubernetes/flux/cluster --allow-missing-secrets

  # The required status check. always(): a cancelled run must not leave the
  # gate skipped, which GitHub would count as passing. It fails when the
  # filter or Flate failed or was cancelled and passes when Flate was skipped.
  success:
    if: ${{ always() }}
    needs: [filter, flate]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        # Through the environment, not inline in the script (zizmor
        # template-injection).
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
