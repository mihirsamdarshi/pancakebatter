[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-just]
glob = ["justfile", "*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt; done'
stage_fixed = true

# mise fmt rewrites the config in place on every run, and a mise lock that
# reads it mid-rewrite prunes every tool from the lockfile, so the two run
# piped while the rest of pre-commit stays parallel.
[[pre-commit.jobs]]
name = "mise"
glob = [".mise/config.toml", ".mise/conf.d/*.toml"]

[pre-commit.jobs.group]
piped = true

[[pre-commit.jobs.group.jobs]]
name = "format-mise"
run = "mise fmt"
stage_fixed = true

[[pre-commit.jobs.group.jobs]]
name = "lock-mise"
run = 'mise lock && git add -A -- .mise ":(exclude).mise/*.toml"'

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
# mise lock sidecars are digest-pinned in mise.lock; reformatting them makes
# `mise install --locked` fail with a digest mismatch.
exclude = [".mise/locks/**", "archive/**"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
exclude = ["archive/**"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
exclude = [".mise/locks/**", "archive/**"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml"]
run = "zizmor --offline {staged_files}"

# Gates kubernetes/ before Flux can see it: the main session commits straight
# to main and Flux reconciles origin/main right away, so CI on push can only
# report breakage after it is live.
#
# pre-push, not pre-commit: it validates exactly what reaches origin (the
# committed tree of each pushed ref, from git's pre-push stdin, not the working
# tree or a partially staged index), runs once per push instead of once per
# commit, and leaves local WIP commits alone. The script itself skips refs
# whose pushed range does not touch kubernetes/ (or the script), so no glob.
#
# A script (.lefthook/pre-push/validate.sh), not a command: lefthook skips
# pre-push *commands* when HEAD equals its upstream, so `git push origin
# bad:main` (or a multi-ref push whose HEAD is already pushed) went through
# ungated, and a `files` override does not change that. Scripts always run.
#
# Fails closed: `mise exec --` supplies the pinned tools whatever the caller's
# PATH, and the script exits non-zero if a tool, a schema download, or a build
# fails.
#
# Bypasses, so this is not the only line of defence:
#   - `git push --no-verify` and `LEFTHOOK=0 git push` skip it on purpose;
#   - GitButler (`but push` and its app) may push without running git hooks.
# The Kubernetes workflow runs the same script on every PR and push to main, so
# a bypassed push still turns CI red.
[pre-push.scripts."validate.sh"]
runner = "bash"
use_stdin = true
